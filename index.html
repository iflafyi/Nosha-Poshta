<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Наша Пошта — симулятор відділення</title>
<meta name="theme-color" content="#d62828">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{
  --red:#d62828;--red2:#a4161a;--red3:#fde8e8;--bg:#f1eee9;--card:#fff;--ink:#222;--mute:#777;--line:#e4ddd3;
  --green:#2a9d55;--green2:#e3f5ea;--amber:#e89a00;--amber2:#fff3d6;--blue:#2c6fbb;--blue2:#e6f0fb;--shelf:#c99a63;--shelf2:#8a6239;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:#ece7df;color:var(--ink);transition:transform .08s,filter .15s}
button:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.pri{background:var(--red);color:#fff;font-weight:600}
button.ok{background:var(--green);color:#fff;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line)}
button.sm{padding:5px 10px;font-size:13px;border-radius:8px}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.hidden{display:none!important}
#app{max-width:1100px;margin:0 auto;padding-bottom:70px}
/* header */
#top{background:linear-gradient(180deg,var(--red),var(--red2));color:#fff;padding:8px 12px 10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0003}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.logo .lbox{background:#fff;color:var(--red);border-radius:7px;padding:1px 6px;font-size:14px}
.branch{opacity:.9;font-size:13px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.pill{background:#ffffff22;border-radius:20px;padding:3px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.topbtn{background:#ffffff22;color:#fff;padding:5px 9px;border-radius:9px;font-size:15px}
.xpbar{height:5px;background:#ffffff33;border-radius:4px;margin-top:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#ffd166;width:0;transition:width .3s}
.clock{font-variant-numeric:tabular-nums}
/* tabs */
#tabs{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;position:sticky;top:0;z-index:15;background:var(--bg)}
#tabs button{white-space:nowrap;background:#fff;border:1px solid var(--line);font-weight:600;position:relative}
#tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:700}
@media(max-width:700px){#toasts{top:auto;bottom:78px}#updbar{bottom:130px}
  #top{padding:6px 8px 7px}.toprow{gap:5px}.pill{font-size:12px;padding:2px 7px}.topbtn{padding:3px 6px;font-size:13px}.branch{display:none}.logo{font-size:15px}
  #tabs{position:fixed;bottom:0;top:auto;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px;justify-content:space-between;gap:2px}
  #tabs button{flex:1;padding:6px 2px;font-size:11px;border:0;display:flex;flex-direction:column;align-items:center;background:transparent}
  #tabs button .ti{font-size:20px}#tabs button.on{background:var(--red3);color:var(--red2)}}
@media(min-width:701px){#tabs button .ti{margin-right:4px}}
main{padding:4px 10px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px #0000000d;border:1px solid var(--line)}
.card h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:6px}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
/* queue */
.queue{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;min-height:120px;align-items:flex-end}
.client{min-width:96px;max-width:96px;background:#faf8f5;border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;position:relative;animation:walkin .5s ease-out}
.client.reg{border-color:var(--amber);background:var(--amber2)}
.client.me{outline:2px solid var(--red)}
.client .av{font-size:34px;line-height:1.1}
.client .nm{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client .kd{font-size:11px;color:var(--mute)}
.client .who{font-size:10px;color:var(--blue);font-weight:600}
.pat{height:5px;background:#e9e4dc;border-radius:3px;margin-top:4px;overflow:hidden}
.pat i{display:block;height:100%;background:var(--green);transition:width .25s linear}
@keyframes walkin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.windows{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.win{border:2px dashed var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff}
.win.act{border-style:solid;border-color:var(--red)}
.win .wt{font-weight:700;font-size:13px;margin-bottom:6px}
.counter{background:linear-gradient(180deg,#e8e2d8,#d9d0c3);height:14px;border-radius:0 0 8px 8px;margin:-2px 0 10px}
.bigstart{text-align:center;padding:26px 12px}
.bigstart .e{font-size:60px}
/* shelves */
.racks{display:flex;flex-wrap:wrap;gap:10px}
.rack{background:var(--shelf2);padding:5px;border-radius:8px}
.rack .rt{color:#fff;font-size:11px;font-weight:700;text-align:center;margin-bottom:3px}
.rack .cells{display:grid;grid-template-columns:repeat(4,46px);gap:4px}
.rack.big .cells{grid-template-columns:repeat(2,70px)}
.cell{background:var(--shelf);border-radius:5px;height:46px;padding:2px;font-size:10px;font-weight:700;color:#3d2a15;display:flex;flex-direction:column;justify-content:space-between;align-items:center;border:2px solid transparent}
.rack.big .cell{height:58px}
.cell .dots{font-size:13px;line-height:1;letter-spacing:-2px}
.cell.glow{border-color:#ffd60a;box-shadow:0 0 10px #ffd60a;animation:pulse 1s infinite}
.cell.full{filter:saturate(.4) brightness(.9)}
.cell.picked{background:#9bd3a8}
@keyframes pulse{50%{box-shadow:0 0 2px #ffd60a}}
.pile{display:flex;flex-wrap:wrap;gap:6px}
.parcel{background:#d8b384;border:1px solid #b08a5c;color:#3d2a15;border-radius:8px;padding:5px 7px;font-size:12px;min-width:70px;text-align:center;position:relative}
.parcel .pe{font-size:20px}
.parcel.sel{outline:3px solid var(--red);transform:translateY(-3px)}
.parcel.s3,.parcel.s4{background:#c69c6d}
.parcel .tag{font-size:9px;font-weight:700}
.fr{color:var(--red2)}
.terminal{background:#1d2b24;color:#7dffb0;font-family:ui-monospace,Consolas,monospace;border-radius:10px;padding:10px;font-size:13px;margin-bottom:8px;min-height:44px}
.terminal b{color:#fff}
/* truck */
.truck{background:#fff;border-radius:14px;border:1px solid var(--line);padding:10px;position:relative;overflow:hidden}
.truckbody{background:linear-gradient(180deg,#f8f8f8,#e8e8e8);border:3px solid #bbb;border-radius:10px;padding:8px;min-height:130px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;position:relative}
.truckbody::before{content:"НАША ПОШТА";position:absolute;right:10px;bottom:6px;color:var(--red);font-weight:900;opacity:.18;font-size:26px;pointer-events:none}
.truckcab{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.truckcab .te{font-size:40px;animation:drive .6s ease-out}
@keyframes drive{from{transform:translateX(-80px)}to{transform:none}}
.box{background:#d8b384;border:1px solid #9c7646;border-radius:6px;width:58px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#3d2a15;position:relative}
.box.s3{width:74px;height:60px}.box.s4{width:90px;height:68px;background:#c49562}
.box .pr{position:absolute;bottom:2px;left:4px;right:4px;height:4px;background:#0002;border-radius:2px;overflow:hidden}
.box .pr i{display:block;height:100%;background:var(--green)}
.timer{font-weight:700;color:var(--red2)}
/* staff & upgrades */
.staff{display:flex;gap:10px;align-items:flex-start}
.staff .av{font-size:38px}
.stars{color:var(--amber);letter-spacing:-1px}
.roles{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.roles button{padding:4px 8px;font-size:12px}
.roles button.on{background:var(--ink);color:#fff}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.up .ue{font-size:30px}
.lvl{display:flex;gap:3px;margin:6px 0}
.lvl i{flex:1;height:6px;border-radius:3px;background:#e9e4dc}
.lvl i.on{background:var(--green)}
/* modal */
#modal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}
.mbox{background:var(--bg);border-radius:16px;max-width:640px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 10px 40px #0005}
.mhead{background:var(--red);color:#fff;padding:10px 14px;border-radius:16px 16px 0 0;display:flex;align-items:center;gap:8px;font-weight:700;position:sticky;top:0;z-index:2}
.mhead .x{margin-left:auto;background:#ffffff33;color:#fff;padding:4px 10px}
.mbody{padding:12px}
.bubble{background:#fff;border-radius:14px;padding:10px 12px;border:1px solid var(--line);position:relative;margin:4px 0 10px 54px}
.bubble::before{content:"";position:absolute;left:-8px;top:14px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.speaker{display:flex;align-items:flex-start;gap:0;position:relative}
.speaker .av{font-size:40px;position:absolute;left:0;top:0}
.steps{display:flex;gap:4px;margin-bottom:10px}
.steps i{flex:1;height:5px;border-radius:3px;background:#ddd5ca}
.steps i.on{background:var(--red)}
.trow{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid #2f4a3c;margin-bottom:5px}
.trow:hover{background:#2a3d33}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.opts button{padding:12px 6px}
.opts button.on{background:var(--ink);color:#fff}
.itemcard{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:10px;border:1px solid var(--line);margin-bottom:10px}
.itemcard .ie{font-size:48px}
.scale{text-align:center;padding:14px}
.scale .disp{display:inline-block;background:#1d2b24;color:#7dffb0;font-family:ui-monospace,monospace;font-size:30px;padding:6px 18px;border-radius:8px;min-width:150px}
.ttn{background:#fff;border:2px dashed #999;border-radius:8px;padding:10px;font-family:ui-monospace,monospace;text-align:center}
.ttn .bar{font-size:26px;letter-spacing:-1px;line-height:1}
/* toasts */
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:94%;max-width:420px}
.toast{background:#222d;color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;animation:tin .25s ease-out;text-align:center;backdrop-filter:blur(4px)}
.toast.good{background:#1f7a43e8}.toast.bad{background:#a4161ae8}.toast.gold{background:#b07a00ee}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#updbar{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 12px;border-radius:12px;z-index:40;display:flex;gap:10px;align-items:center}
/* online */
.lb{width:100%;border-collapse:collapse;font-size:14px}
.lb td,.lb th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.lb tr.mine{background:var(--amber2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;margin-right:4px}
.dot.on{background:#2fbf63;box-shadow:0 0 6px #2fbf63}
.chat{height:340px;overflow-y:auto;background:#faf8f5;border-radius:10px;padding:8px;border:1px solid var(--line);margin-bottom:8px}
.msg{margin-bottom:6px}.msg b{color:var(--red2)}.msg .t{color:var(--mute);font-size:11px;margin-left:4px}
.subtabs{display:flex;gap:6px;margin-bottom:10px}
.subtabs button.on{background:var(--ink);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv b{text-align:right}
.hearts{color:var(--red);font-size:12px}
.code{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line)}
.guide li{margin-bottom:6px}
.banner{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.banner.ev{border-left-color:var(--amber);background:var(--amber2)}.banner.insp{border-left-color:var(--red);background:var(--red3)}.banner.dark{border-left-color:#000;background:#2b2b2b;color:#eee}
#dark{position:fixed;inset:0;pointer-events:none;z-index:55;background:radial-gradient(circle 190px at var(--fx,50%) var(--fy,45%),transparent 0,transparent 55%,rgba(5,5,15,.8) 100%)}

/* сканер штрихкодів */
.bc{position:relative;display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:1px solid #bbb;border-radius:6px;padding:4px 6px 2px;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
.bc .bars{display:flex;align-items:stretch;height:30px;gap:1px}
.bc .bars i{display:block;background:#111}
.bc .bn{font:10px ui-monospace,monospace;color:#333;letter-spacing:.5px}
.bc::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#ff1f1f;box-shadow:0 0 8px #ff1f1f;opacity:0}
.bc.scanning::after{opacity:1;animation:laser .35s linear infinite}
.bc.scanned{outline:3px solid var(--green)}
@keyframes laser{0%{top:8%}50%{top:88%}100%{top:8%}}
.parcel .bc{margin-top:3px;padding:2px 3px 0}.parcel .bc .bars{height:16px}.parcel .bc .bn{font-size:8px}
.cellbox{background:#f6efe5;border:2px solid var(--shelf);border-radius:10px;padding:10px;margin:8px 0}
.phonebox{display:inline-block;background:#222;border-radius:18px;padding:10px 8px;margin:4px 0 10px 54px}
.phonebox .scr{background:#fff;border-radius:10px;padding:8px;text-align:center;font-size:12px}
.doc{background:#fffdf3;border:1px solid #d9cfae;border-radius:8px;padding:10px;font-family:Georgia,serif;font-size:14px;margin-bottom:10px;box-shadow:2px 2px 0 #0001}
.doc .stamp{display:inline-block;border:2px solid #2c6fbb;color:#2c6fbb;border-radius:50%;padding:6px 8px;font-size:10px;transform:rotate(-12deg);font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sgrid button{background:#d8b384;border:1px solid #9c7646;padding:8px 2px;font-size:12px;color:#3d2a15}
.sgrid button .pe{font-size:22px;display:block}
.sgrid button.no{opacity:.35}
.opened{font-size:46px;text-align:center;padding:6px}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="modal" class="hidden"></div>
<div id="toasts"></div>
<div id="updbar" class="hidden"></div>
<div id="dark" class="hidden"></div>
<script>
'use strict';
const GAME_BUILD = 202610311959; // ставиться build.py
const CFG = window.GAME_CONFIG || {};
const SAVE_KEY = 'np-save-v1';
const MIN_PER_SEC = 1.8; // ігрових хвилин за реальну секунду (зміна 12 год ≈ 6,5 хв)

/* ---------- утиліти ---------- */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const pad = (n,l=2) => String(n).padStart(l,'0');
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('uk-UA');
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const hhmm = m => `${pad(Math.floor(m/60)%24)}:${pad(Math.floor(m%60))}`;
const stars = n => '★'.repeat(n) + '☆'.repeat(5-n);

/* ---------- дані ---------- */
const SIZE_N = ['Конверт','S','M','L','XL'];
const SIZE_CM = ['≈ 30×21 см, пласке','≈ 25×20×10 см','≈ 40×30×20 см','≈ 60×40×40 см','більше 60 см'];
const ITEMS = [
  {n:'Документи', e:'📄', s:0, w:[0.1,0.4]},
  {n:'Телефон', e:'📱', s:1, w:[0.3,0.8], f:1, v:[3000,15000]},
  {n:'Книжки', e:'📚', s:2, w:[1,4]},
  {n:'Кросівки', e:'👟', s:2, w:[1,2]},
  {n:'Одяг', e:'👕', s:1, w:[0.3,1.5]},
  {n:'Банки з варенням', e:'🫙', s:2, w:[2,5], f:1},
  {n:'Ноутбук', e:'💻', s:2, w:[2,3.5], f:1, v:[8000,40000]},
  {n:'Іграшки', e:'🧸', s:2, w:[0.5,2]},
  {n:'Розсада', e:'🌱', s:2, w:[1,3], f:1},
  {n:'Мед', e:'🍯', s:1, w:[1,3], f:1},
  {n:'Запчастини', e:'⚙️', s:3, w:[5,15], v:[1000,8000]},
  {n:'Шини', e:'🛞', s:4, w:[20,40], packed:1, v:[4000,16000]},
  {n:'Мікрохвильовка', e:'📦', s:3, w:[10,14], f:1, packed:1, v:[2000,5000]},
  {n:'Велосипед', e:'🚲', s:4, w:[12,18], packed:1, v:[5000,20000]},
  {n:'Косметика', e:'💄', s:1, w:[0.3,1], f:1},
  {n:'Посуд', e:'🍽️', s:2, w:[2,6], f:1},
  {n:'Інструменти', e:'🔧', s:3, w:[4,10], v:[800,5000]},
  {n:'Подарунок', e:'🎁', s:1, w:[0.5,2]},
  {n:'Каструля', e:'🍲', s:2, w:[1.5,3]},
  {n:'Картина', e:'🖼️', s:3, w:[2,5], f:1, v:[1000,10000]},
  {n:'Чохол для телефону', e:'📲', s:0, w:[0.05,0.2]},
  {n:'Кава в зернах', e:'☕', s:1, w:[0.5,1.5]},
  {n:'Квіти', e:'💐', s:2, w:[0.5,2], f:1, ev:1},
  {n:'Ялинкові іграшки', e:'🎄', s:1, w:[0.3,1.5], f:1, ev:1},
  {n:'Шоколад', e:'🍫', s:0, w:[0.1,0.5], ev:1},
];
const BASE_ITEMS = ITEMS.filter(i => !i.ev);
/* ---------- події дня ---------- */
const EVENTS = {
  sale:{n:'Розпродаж на маркетплейсі', e:'🏷️', flow:1.3, truck:1.35, extra:1, items:['Одяг','Кросівки','Косметика','Чохол для телефону'], d:'Інтернет-магазини влаштували знижки — посилок більше, приїде додаткова машина.'},

function cellsList(){

  const n = smallCount();
  for (let i=0;i<n;i++) small.push(`${Math.floor(i/8)+1}-${pad(i%8+1)}`);
  for (let i=0;i<bigCount();i++) big.push(`Г-${pad(i+1)}`);
  return {small, big};
}
function cellLoad(){
  const m = {};
  for (const p of G.parcels) if (p.state === 'cell') m[p.cell] = (m[p.cell]||0) + 1;
  return m;
}
function targetCell(p){
  const {small, big} = cellsList();
  const list = smallCell(p.s) ? small : big;
  const cap = smallCell(p.s) ? 3 : 2;
  const load = cellLoad();
  let best = Infinity, opts = [];
  for (const c of list){ const l = load[c]||0; if (l >= cap) continue; if (l < best){ best = l; opts = [c]; } else if (l === best) opts.push(c); }
  return opts.length ? pick(opts) : null;
}

function beep(f=1800, d=0.08, type='square', v=0.05){
  if (!G || !G.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(AC.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.stop(AC.currentTime + d + 0.02);
  } catch(e){}
}

function truckArrive(kind){
  const leave = {m:600, x:720, d:870, e:1185}[kind];
  if (kind === 'e'){
    G.truck = {kind:'out', leaveAt:leave, key:kind};
    sBell(); toast('🚚 Приїхала вечірня машина — завантаж відправлення!', 'gold');
  } else {
    let n = ri(6,9) + G.level + G.up.tier*4;
    if (kind === 'd') n = Math.max(3, Math.round(n*0.6));
    if (kind === 'x') n = Math.max(4, Math.round(n*0.7));
    const ev = curEvent(); if (ev) n = Math.round(n*ev.truck);
    const ids = [];
    // посилки постійним клієнтам
    for (const r of REGS) if (r.kind === 'get' && G.level >= r.lvl && Math.random() < 0.4){
      const ri_ = regInfo(r.id);
      const it = r.big ? pick(ITEMS.filter(i => i.s >= 3)) : pick(ITEMS.filter(i => i.s <= 2));
      ids.push(makeParcel({item:it, phone:ri_.phone, name:r.n, reg:r.id}).id);
    }
    for (let i=0;i<n;i++){
      const p = makeParcel();
      ids.push(p.id);
      if (Math.random() < 0.15 && i < n-1){ ids.push(makeParcel({phone:p.phone, name:p.name}).id); i++; }
    }
    G.truck = {kind:'in', leaveAt:leave, key:kind};
    sBell(); toast(`🚚 Приїхала ${kind === 'x' ? 'додаткова ' : ''}машина: ${ids.length} посилок на розвантаження!`, 'gold');
  }
  G.trucksDone[kind] = 1;
  dirty = true;
}
function truckLeave(){
  const t = G.truck; if (!t) return;
  if (t.kind === 'in'){
    const left = G.parcels.filter(p => p.state === 'truck');
    if (left.length){
      G.parcels = G.parcels.filter(p => p.state !== 'truck');
      G.rating = clamp(G.rating - 0.03*left.length, 1, 5);
      G.today.returned += left.length;
      toast(`😬 Машина поїхала, ${left.length} посилок не розвантажено — повертаються на сортування`, 'bad');
    }
  } else {
    const loaded = G.parcels.filter(p => p.state === 'loaded').length;
    G.parcels = G.parcels.filter(p => p.state !== 'loaded');
    const notL = G.parcels.filter(p => p.state === 'outgoing').length;
    if (notL){ G.rating = clamp(G.rating - 0.02*notL, 1, 5); toast(`🚚 Поїхала з ${loaded} відправленнями. Залишилось ${notL} — поїдуть завтра (рейтинг ↓)`, 'bad'); }
    else if (loaded) toast(`🚚 Машина поїхала: ${loaded} відправлень в дорозі!`, 'good');
  }
  G.truck = null; dirty = true;
}

  if (G.queue.length >= queueMax()) return;
  const avail = readyParcels();
  const unlocked = REGS.filter(r => G.level >= r.lvl && !G.queue.some(c => c.reg === r.id));
  let reg = null;
  const regPool = unlocked.filter(r => r.kind === 'send' || avail.some(p => p.reg === r.id));
  if (regPool.length && (Math.random() < 0.22 || regPool.some(r => r.kind==='get' && avail.some(p => p.reg===r.id) && Math.random() < 0.15))) reg = pick(regPool);
  const plain = avail.filter(p => !p.reg);
  const kind = reg ? reg.kind : (plain.length && Math.random() < 0.62 ? 'get' : 'send');
  const pp = reg ? {name:reg.n, av:reg.av} : person();
  const c = {id:G.cid++, kind, name:pp.name, av:pp.av, reg: reg ? reg.id : null, by:null, pids:[], items:[]};
  const regMul = reg ? reg.pat : 1;
  c.max = c.pat = rnd(45, 65) * patMul() * regMul;
  c.card = reg && reg.card ? true : Math.random() < 0.5;
  if (kind === 'get'){
    const pool = reg ? avail.filter(p => p.reg === reg.id) : plain;
    const p0 = pick(pool);
    const group = avail.filter(p => p.phone === p0.phone);
    if (!reg && G.up.locker && Math.random() < G.up.locker*0.12){
      group.forEach(p => { p.state = 'gone'; });
      G.parcels = G.parcels.filter(p => p.state !== 'gone');
      addMoney(12*group.length); G.stats.issued += group.length; G.today.issued += group.length;
      if (Math.random() < 0.4) toast(`🟥 ${esc(pp.name)} забрав(ла) посилку з поштомату (+${12*group.length} ₴)`);
      dirty = true; return;
    }
    c.phone = p0.phone; c.pids = group.map(p => p.id);
    group.forEach(p => p.res = c.id);
    c.hi = reg ? reg.hi : pick(GET_HI);
    c.app = Math.random() < 0.4;
    if (!reg) specialGet(c, p0, group);
    else if (Math.random() < 0.06) p0.lost = 1;
  } else {
    const n = reg && reg.multi ? reg.multi : (Math.random() < 0.12 ? 2 : 1);
    for (let i=0;i<n;i++){
      const it = reg ? ITEM(pick(reg.items)) : pickItem();
      c.items.push({item:it.n, e:it.e, s:it.s, f:it.f?1:0, packed:it.packed?1:0, w:+rnd(it.w[0], it.w[1]).toFixed(1), city:pick(CITIES), val: it.v ? Math.round(rnd(it.v[0], it.v[1])/100)*100 : 0});
    }
    c.hi = reg ? reg.hi : pick(SEND_HI);
  }
  if (reg){
    const info = regInfo(reg.id);
    if (!info.met){ info.met = true; toast(`⭐ Новий постійний клієнт: ${reg.av} ${reg.n}!`, 'gold'); }
  }
  G.queue.push(c); G.stats.clients++;
  dirty = true;
}
const RELS = ['мами','тата','сестри','брата','бабусі','дідуся','сусідки','чоловіка','дружини'];
const WRONG_IN = ['цеглина 🧱','старі шкарпетки 🧦','зовсім інший товар 📦','порожня коробка 🫥','китайська підробка 🎭'];
function specialGet(c, p0, group){
  const r = Math.random();
  const codP = group.find(p => p.cod);
  if (codP && r < 0.13){
    c.inspect = {pid:codP.id, bad: Math.random() < 0.55 ? pick(['broken','wrong']) : null, wrongIn: pick(WRONG_IN)};
    c.hi = pick(['Добрий день! Можна спершу подивитись, що там, а потім оплачу?','Вітаю! Хочу розкрити посилку перед оплатою.','Здрастуйте, я по посилку, але спершу огляну, добре?']);
  } else if (r < 0.24){
    const type = pick(['city','person','back']);
    let city = pick(CITIES.filter(x => x !== p0.city));
    c.redir = {type, city, name: person().name, from: p0.from};
    c.hi = type === 'city' ? `Добрий день! Я переїхав(ла), можна переслати посилку в <b>${city}</b>?`
      : type === 'person' ? `Вітаю! Хочу переоформити посилку на іншу людину — <b>${c.redir.name}</b>, вона забере в місті ${city}.`
      : 'Здрастуйте! Я передумав(ла), поверніть цю посилку відправнику, будь ласка.';
  } else if (r < 0.35){
    const ok = Math.random() < 0.55;
    const pp = person();
    c.name = pp.name; c.av = ok ? pp.av : pick(['🕶️', pp.av, pp.av]);
    c.proxy = {rel: pick(RELS), ok, kind: ok ? pick(['doc','app']) : pick(['noDoc','wrongName','expired']), other: person().name};
    c.hi = `Добрий день! Я по посилку для ${c.proxy.rel}.`;
    c.app = false;
  } else if (r < 0.43){
    p0.lost = 1;
  }
}
function removeClient(c){
  G.queue = G.queue.filter(x => x.id !== c.id);
  G.parcels.forEach(p => { if (p.res === c.id) p.res = null; });
  G.staff.forEach(s => { if (s.cl === c.id) s.cl = null; });
  dirty = true;
}
function rate(sat, c){
  sat = clamp(sat + satBonus() - (G.dirt > 60 ? 0.3 : 0), 1, 5);
  G.dirt = clamp(G.dirt + ((WEATHER[G.weather]||{}).wet ? 2.2 : 1.2), 0, 100);
  if (G.insp && G.insp.state === 'on') G.insp.served++;
  G.rating = clamp(G.rating + (sat - G.rating)*0.06, 1, 5);
  G.today.served++; G.today.satSum += sat;
  if (c && c.reg){
    const info = regInfo(c.reg); info.visits++;
    if (sat >= 4) info.hearts = Math.min(5, info.hearts + 1);
    else if (sat < 3) info.hearts = Math.max(0, info.hearts - 1);
  }
  return sat;
}
function tipFor(c, sat){
  if (!c.reg || sat < 4) return 0;
  const r = REG(c.reg), info = regInfo(c.reg);
  return Math.round(r.tip * (1 + info.hearts*0.3) * tipMul());
}
function clientLeftAngry(c){
  if (FLOW && FLOW.cid === c.id){ FLOW = null; closeModal(); }
  removeClient(c);
  rate(1, c);
  G.today.angry++;
  if (G.insp && G.insp.state === 'on') G.insp.angry++;
  sErr();
  toast(`😠 ${esc(c.name)}: «${pick(LEAVE_ANGRY)}»`, 'bad');
}

/* ---------- гроші та досвід ---------- */
function addMoney(n){ G.money += n; if (n > 0){ G.stats.earned += n; G.today.earned += n; } dirty = true; }
function addXp(n){
  G.xp += n;
  while (G.xp >= needXp(G.level)){
    G.xp -= needXp(G.level); G.level++;
    const unl = [];
    for (const k in UPS){ const u = UPS[k]; if (u.need.includes(G.level)) unl.push(`${u.e} ${u.n}`); }
    REGS.filter(r => r.lvl === G.level).forEach(r => unl.push(`${r.av} постійний клієнт: ${r.n}`));
    sCash();
    showLevelUp(unl);
  }
  dirty = true;
}

/* ---------- персонал ---------- */
function genCand(){
  const p = person();
  const lvl = Math.random() < 0.6 ? 1 : Math.random() < 0.75 ? 2 : 3;
  return {id:G.sid++, name:p.name, av:p.av, lvl, salary: 250 + lvl*120 + ri(0,6)*10, role:'store', t:0, cl:null, training:0, done:0};
}
function refreshCand(){ G.cand = [genCand(), genCand(), genCand()]; G.candDay = G.day; }
function frontBusy(){ return G.staff.filter(s => s.cl).length; }
function staffTick(dt){
  for (const s of G.staff){
    if (s.training || s.role === 'rest'){ s.cl = null; continue; }
    if (s.role === 'store'){
      s.t += dt;
      if (s.t >= storeIv(s)){ s.t = 0; storeAction(s); }
    } else {
      if (!s.cl){
        if (frontBusy() >= G.up.windows - 1) { s.idle = 'no-window'; continue; }
        const want = s.role === 'issue' ? 'get' : 'send';
        const c = G.queue.find(c => !c.by && c.kind === want);
        s.idle = c ? null : 'no-clients';
        if (c){ c.by = s.id; s.cl = c.id; s.t = 0; dirty = true; }
      } else {
        s.t += dt;
        if (s.t >= serveT(s)) staffFinish(s);
      }
    }
  }
}
function staffFinish(s){
  const c = G.queue.find(c => c.id === s.cl); s.cl = null; s.t = 0;
  if (!c) return;
  const err = Math.random() < errCh(s);
  let money = 0, n = 0;
  if (c.kind === 'get'){
    let ps = G.parcels.filter(p => c.pids.includes(p.id));
    ps.forEach(p => { p.lost = 0; });
    if (c.redir){ ps.forEach(p => redirectParcel(p, c.redir)); money = c.redir.type === 'back' ? 10 : 55; n = ps.length; ps = []; }
    if (c.proxy && !c.proxy.ok){
      if (Math.random() < 0.45 + s.lvl*0.1){ removeClient(c); toast(`🚫 ${esc(s.name)} не віддав(ла) посилку шахраю`, 'good'); addXp(5); return; }
      G.rating = clamp(G.rating - 0.15, 1, 5); toast(`😱 ${esc(s.name)} видав(ла) посилку шахраю! Рейтинг ↓`, 'bad');
    }
    if (c.inspect && c.inspect.bad){ const bp = ps.find(p => p.id === c.inspect.pid); if (bp){ returnParcel(bp); ps = ps.filter(p => p !== bp); money += 15; } }
    n += ps.length;
    money += ps.reduce((a,p) => a + 15 + Math.round(p.cod*0.02), 0);
    G.parcels = G.parcels.filter(p => !ps.includes(p));
    G.stats.issued += ps.length; G.today.issued += ps.length;
    n = Math.max(n, 1);
  } else {
    for (const it of c.items){
      const pk = PACK.find(x => x.k === (it.packed ? 9 : it.s)) || PACK[0];
      money += sendPrice(it.w, it.f) + (it.s >= 4 ? 0 : pk.price) + valFee(it.val);
      const p = makeParcel({item:ITEM(it.item), state:'outgoing'}); p.w = it.w; p.city = it.city;
      n++;
    }
    G.stats.sent += n; G.today.sent += n;
  }
  removeClient(c);
  const sat = rate(err ? 2 : 4 + (Math.random() < 0.3 ? 1 : 0), c);
  const tip = tipFor(c, sat);
  addMoney(Math.round(money*0.9) + tip); G.today.tips += tip;
  addXp(4*n);
  if (err) toast(`⚠️ ${esc(s.name)} помилилась(вся) з клієнтом — оцінка низька`, 'bad');
}
function storeAction(s){
  const truckBox = G.parcels.find(p => p.state === 'truck');
  if (truckBox){ truckBox.state = 'pile'; G.stats.unloaded++; G.today.unloaded++; dirty = true; return; }
  const pile = G.parcels.filter(p => p.state === 'pile' && p.id !== G.hand);
  for (const p of pile){
    const cell = targetCell(p);
    if (cell){ placeParcel(p, cell, true); return; }
  }
  if (G.truck && G.truck.kind === 'out'){
    const o = G.parcels.find(p => p.state === 'outgoing');
    if (o){ o.state = 'loaded'; dirty = true; return; }
  }
  if (G.dirt > 0) G.dirt = Math.max(0, G.dirt - 4); // вільна хвилинка — прибирає зал
}
function returnParcel(p){ p.state = 'outgoing'; p.city = p.from || pick(CITIES); p.ret = 1; p.cell = null; p.res = null; p.lost = 0; dirty = true; }
function redirectParcel(p, rd){
  if (rd.type === 'back') return returnParcel(p);
  p.state = 'outgoing'; p.city = rd.city; p.redir = 1; p.cell = null; p.res = null; p.lost = 0; p.ttn = ttn();
  if (rd.type === 'person') p.name = rd.name;
  dirty = true;
}
function placeParcel(p, cell, byStaff){
  p.state = 'cell'; p.cell = cell; p.inDay = G.day; p.inT = G.time; p.target = null;
  if (G.hand === p.id) G.hand = null;
  G.stats.placed++;
  if (!byStaff){ addXp(2); }
  dirty = true;
}

/* ---------- день: свята, погода, перевірка, світло ---------- */
function rollDay(){
  G.ev = (NET.gev && EVENTS[NET.gev]) ? NET.gev : eventFor(G.day) || (G.day >= 3 && Math.random() < 0.06 ? 'sale' : null);
  G.eve = !G.ev && !!eventFor(G.day + 1);
  G.weather = NET.gweather && WEATHER[NET.gweather] ? NET.gweather : rollWeather();
  G.insp = null; G.outage = null;
  if ((G.level >= 3 && G.day - (G.lastInsp||0) >= 3 && Math.random() < 0.16) || NET.forceInsp){ G.insp = {at: ri(600, 1020), state:'wait'}; NET.forceInsp = false; }
  if ((G.day >= 3 && Math.random() < 0.09) || NET.forceOutage){ const f = ri(600, 1020); G.outage = {from:f, to:f + ri(60,150), on:false, done:false}; NET.forceOutage = false; }
  const ev = curEvent(), w = WEATHER[G.weather];
  setTimeout(() => {
    if (ev) toast(`${ev.e} Сьогодні ${ev.n}! ${ev.d}`, 'gold');
    else if (G.eve) toast('🎉 Завтра свято — сьогодні ажіотаж, черга аж до дверей!', 'gold');
    toast(`${w.e} Погода: ${w.n}${w.mul < 1 ? ' — клієнтів буде менше' : ''}`);
  }, 600);
}
function dayFlowMul(){
  const ev = curEvent(), w = WEATHER[G.weather] || WEATHER.sun;
  return (ev ? ev.flow : 1) * (G.eve ? 1.25 : 1) * w.mul;
}
function inspTick(){
  const I = G.insp; if (!I) return;
  if (I.state === 'wait' && G.time >= I.at){
    I.state = 'on'; I.until = G.time + 90; I.mist = 0; I.angry = 0; I.served = 0; I.qSum = 0; I.qN = 0; I.dirtSum = 0;
    sBell(); toast('👔 Раптова перевірка! Регіональний менеджер оцінює чистоту, швидкість і помилки.', 'gold');
    dirty = true;
  }
  if (I.state === 'on'){
    I.qSum += G.queue.length; I.qN++; I.dirtSum += G.dirt;
    if (G.time >= I.until) inspFinish();
  }
}
function inspFinish(quiet){
  const I = G.insp; I.state = 'done'; G.lastInsp = G.day;
  const clean = clamp(5 - (I.dirtSum/Math.max(1,I.qN))/22, 1, 5);
  const speed = clamp(5 - I.angry*1.2 - Math.max(0, I.qSum/Math.max(1,I.qN) - 3)*0.4, 1, 5);
  const errs = clamp(5 - I.mist*0.8, 1, 5);
  const avg = (clean + speed + errs)/3;
  const bonus = avg >= 3.5 ? Math.round((avg - 2.5)*500/50)*50 : 0;
  I.res = {clean:+clean.toFixed(1), speed:+speed.toFixed(1), errs:+errs.toFixed(1), avg:+avg.toFixed(1), bonus};
  if (bonus){ addMoney(bonus); G.stats.inspGood = (G.stats.inspGood||0) + 1; countTask('insp', 1); }
  if (avg < 2.5) G.rating = clamp(G.rating - 0.1, 1, 5);
  if (quiet) return;
  showModal('👔 Результати перевірки', `<div class="kv"><span>🧹 Чистота</span><b>${stars(Math.round(clean))}</b><span>⚡ Швидкість</span><b>${stars(Math.round(speed))}</b>
    <span>✅ Без помилок</span><b>${stars(Math.round(errs))}</b><span>Загальна оцінка</span><b>${I.res.avg} / 5</b></div>
    <p>${bonus ? `🎉 Менеджер задоволений! Премія відділенню: <b>${fmt(bonus)} ₴</b>` : avg < 2.5 ? '😬 Менеджер незадоволений, рейтинг відділення знижено.' : '🙂 Непогано, але без премії. Наступного разу вийде!'}</p>
    <button class="pri" style="width:100%" data-act="mclose">Добре</button>`);
}
function outageTick(){
  const O = G.outage; if (!O || O.done) return;
  if (!O.on && G.time >= O.from){
    O.on = true; FLOW && (FLOW.rows = terminalRows(flowClient() || {phone:''}));
    if (G.up.gen){ G.money -= 100; toast('🔌 Відключення світла! Генератор запрацював (пальне −100 ₴)', 'gold'); }
    else { sErr(); toast('🔦 Відключення світла! Термінал не працює — все вручну, з ліхтариком. Картки не приймаються.', 'bad'); }
    dirty = true;
  }
  if (O.on && G.time >= O.to){ O.on = false; O.done = true; toast('💡 Світло дали!', 'good'); dirty = true; }
}
function cleanHall(){
  if (G.phase !== 'day' || G.dirt < 5) return;
  G.time += 10; G.dirt = 0; beep(300, 0.2, 'triangle', 0.04); toast('🧹 Зал прибрано (−10 хв)', 'good'); dirty = true;
}

/* ---------- день ---------- */
function startDay(){
  G.phase = 'day'; G.time = 480; G.today = blankToday(); G.trucksDone = {}; G.truck = null;
  rollDay();
  if (G.candDay < G.day || !G.cand.length) refreshCand();
  truckArrive('m');
  TAB = 'ramp';
  if (!G.seenGuide) showGuide();
  save(); dirty = true;
}
function endDay(){
  if (FLOW) closeModal();
  if (G.truck) truckLeave();
  if (G.insp && G.insp.state === 'on') inspFinish(true);
  for (const c of [...G.queue]) removeClient(c);
  G.queue = [];
  // зарплати
  let sal = 0;
  for (const s of G.staff) if (s.role !== 'rest') sal += s.salary;
  G.money -= sal; G.today.salaries = sal;
  // навчання
  const trained = [];
  for (const s of G.staff) if (s.training && s.training <= G.day){ s.training = 0; s.lvl = Math.min(5, s.lvl + 1); trained.push(s); }
  // термін зберігання 5 днів
  const old = G.parcels.filter(p => p.state === 'cell' && G.day - p.inDay >= 5);
  if (old.length){ G.parcels = G.parcels.filter(p => !old.includes(p)); G.rating = clamp(G.rating - 0.02*old.length, 1, 5); }
  const sum = {...G.today, day:G.day, expired:old.length, trained, ev:G.ev, insp:G.insp && G.insp.res};
  G.ev = null; G.eve = false; G.outage = null; G.insp = null;
  G.day++; G.phase = 'night'; G.time = 480;
  refreshCand();
  save(); cloudSave(true);
  showDaySummary(sum);
  dirty = true;
}

/* ---------- головний цикл ---------- */
function tick(){
  const now = performance.now();
  let dt = Math.min(0.5, (now - lastT)/1000); lastT = now;
  if (!G) return;
  if (G.phase === 'day' && !paused){
    const sp = G.settings.speed;
    dt *= sp;
    const prev = G.time;
    G.time += dt*MIN_PER_SEC;
    const dMin = G.time - prev;
    const ev = curEvent();
    if (ev && ev.extra && prev < 630 && G.time >= 630 && !G.trucksDone.x){ if (G.truck) truckLeave(); truckArrive('x'); }
    if (prev < 780 && G.time >= 780 && !G.trucksDone.d){ if (G.truck) truckLeave(); truckArrive('d'); }
    if (prev < 1080 && G.time >= 1080 && !G.trucksDone.e){ if (G.truck) truckLeave(); truckArrive('e'); }
    if (G.truck && G.time >= G.truck.leaveAt) truckLeave();
    // нові клієнти
    if (G.time < 1170){
      const h = G.time/60;
      const tf = h < 10 ? 0.7 : h < 12 ? 1 : h < 14 ? 1.4 : h < 17 ? 1 : h < 19 ? 1.5 : 0.6;
      const lam = (0.03 + G.level*0.004) * (1 + G.up.ads*0.15) * (1 + G.up.tier*0.35) * tf * (0.5 + G.rating/7) * dayFlowMul();
      if (Math.random() < lam*dMin) spawnClient();
    }
    // терпіння
    for (const c of [...G.queue]){
      if (c.by && c.by !== 'me') continue;
      c.pat -= dt * (c.by === 'me' ? 0.3 : 1);
      if (c.pat <= 0) clientLeftAngry(c);
    }
    staffTick(dt * (manualMode() ? 0.6 : 1));
    inspTick(); outageTick();
    if (G.time >= 1200) endDay();
  }
  if (dirty && (!ptrDown || now - ptrDown > 1200)){ dirty = false; render(); } else liveUpdate();
}

function renderTabs(){

}

function terminalRows(c){
  const phones = [...new Set(G.parcels.filter(p => p.state === 'cell').map(p => p.phone))].filter(p => p !== c.phone);

  if (act === 'open'){ FLOW.opened = true; beep(300, 0.15, 'sawtooth', 0.03); return renderFlow(); }
  if (act === 'inspok'){
    if (c.inspect.bad){ mistake('Клієнт відмовляється платити — оформи відмову!'); return renderFlow(); }
    FLOW.step = nextGetStep(c, 'inspect'); return renderFlow();
  }
  if (act === 'inspno'){
    if (!c.inspect.bad){ mistake('Все ціле, клієнт хоче забрати посилку!'); return renderFlow(); }
    FLOW.step = 'refuse'; return renderFlow();
  }
  if (act === 'refuse'){
    const ip = G.parcels.find(p => p.id === c.inspect.pid);
    if (ip) returnParcel(ip);
    c.pids = c.pids.filter(id => id !== c.inspect.pid); FLOW.picked = FLOW.picked.filter(id => id !== c.inspect.pid);
    FLOW.refused = 1; sScan(); countTask('refuse', 1);
    if (!c.pids.length) return finishRefuse(c);
    c.inspect = null; FLOW.step = nextGetStep(c, 'cells'); return renderFlow();
  }
  if (act === 'redirpick'){
    const rd = c.redir, right = rd.type === 'city' ? rd.city : rd.type === 'person' ? rd.name : 'back';
    if (v !== right){ mistake(rd.type === 'back' ? 'Клієнт просив повернути відправнику!' : rd.type === 'city' ? `Клієнт казав «${rd.city}»!` : `Новий отримувач — ${rd.name}!`); return renderFlow(); }
    sScan(); FLOW.step = nextGetStep(c, 'redir'); return renderFlow();
  }
  if (act === 'reprint') return finishRedir(c);
  if (act === 'valpick'){
    const it = c.items[FLOW.i];
    if (+v !== it.val){ mistake(`Клієнт казав ${fmt(it.val)} ₴!`); return renderFlow(); }
    sScan(); FLOW.step = 'city'; FLOW.cityOpts = null; return renderFlow();
  }
  if (act === 'pay'){
    if ((v === 'card') !== (c.card && !manualMode())){ mistake(c.card ? 'Клієнт хотів оплатити карткою' : 'Клієнт дає готівку!'); return renderFlow(); }
    sScan();
    if (v === 'card') nextAfterPay(c); else { FLOW.pay.stage = 'change'; }
    return renderFlow();
  }
  if (act === 'change'){
    const total = flowTotal(c);
    if (+v === FLOW.pay.given - total){ sCash(); nextAfterPay(c); } else mistake('Неправильна решта!');
    return renderFlow();
  }
  if (act === 'give') return finishGet(c);
  if (act === 'packsel'){ FLOW.pack = +v; return renderFlow(); }
  if (act === 'wrap'){ FLOW.wrap = el.checked; return; }
  if (act === 'pack'){
    const it = c.items[FLOW.i];
    const k = FLOW.pack;
    if (it.packed || it.s >= 4){ if (k !== 9){ mistake('Ця річ уже запакована власником — пакування не потрібне'); return renderFlow(); } }
    else if (k === 9){ mistake('Річ не запакована — треба обрати пакування'); return renderFlow(); }
    else if (k < it.s){ mistake('Не влазить! Треба більше пакування'); return renderFlow(); }
    if (it.f && !FLOW.wrap && !(it.packed)){ mistake('Крихке без пухирцевої плівки розіб’ється!'); return renderFlow(); }
    if (k !== 9 && k > it.s + 1){ FLOW.extra -= 0.5; toast('Завелика коробка, клієнт трохи незадоволений'); }
    const pk = PACK.find(p => p.k === k);
    it.packPrice = (pk ? pk.price : 0) + (FLOW.wrap ? 15 : 0);
    sScan(); FLOW.step = 'weigh'; FLOW.weighed = false;
    return renderFlow();
  }
  if (act === 'weigh'){ FLOW.weighed = true; beep(1200, 0.05); return renderFlow(); }
  if (act === 'weighok'){ FLOW.step = c.items[FLOW.i].val ? 'value' : 'city'; FLOW.valOpts = null; FLOW.cityOpts = null; return renderFlow(); }
  if (act === 'city'){
    const it = c.items[FLOW.i];
    if (v !== it.city){ mistake(`Клієнт казав «${it.city}»!`); return renderFlow(); }
    sScan(); it.ttn = ttn();
    if (FLOW.i < c.items.length - 1){ FLOW.i++; FLOW.step = 'pack'; FLOW.pack = null; FLOW.wrap = false; }
    else FLOW.step = 'pay';
    return renderFlow();
  }
  if (act === 'print') return finishSend(c);
}
function nextAfterPay(c){ FLOW.step = c.kind === 'get' ? (c.redir ? 'reprint' : 'give') : 'print'; FLOW.pay = {}; }
function afterPick(c){
  if (c.pids.every(id => FLOW.picked.includes(id))){ FLOW.openCell = null; FLOW.step = nextGetStep(c, 'cells'); }
}
function finishRefuse(c){
  const sat = rate(flowSat(c) + 0.5, c);
  FLOW = null; closeModal(); removeClient(c);
  addMoney(15); addXp(12); sCash();
  toast(`${'⭐'.repeat(Math.round(sat))} Відмову оформлено, посилка поїде назад відправнику`, 'good');
}
function finishRedir(c){
  const ps = G.parcels.filter(p => c.pids.includes(p.id));
  ps.forEach(p => redirectParcel(p, c.redir));
  if (FLOW.newTtn && ps[0]) ps[0].ttn = FLOW.newTtn;
  const fee = c.redir.type === 'back' ? 0 : REDIR_FEE;
  const sat = rate(flowSat(c), c);
  FLOW = null; closeModal(); removeClient(c);
  addMoney(fee + 10); addXp(14); sCash(); countTask('redir', 1);
  toast(`${'⭐'.repeat(Math.round(sat))} ${c.redir.type === 'back' ? '🔙 Повернення оформлено' : '↪ Переадресацію оформлено'} · +${fee + 10} ₴ · поїде вечірньою машиною`, 'good');
}
function flowSat(c){
  let sat = 5 - FLOW.mist + FLOW.extra;
  if (c.pat/c.max < 0.3) sat -= 1;
  return sat;
}
function finishGet(c){
  const ps = G.parcels.filter(p => c.pids.includes(p.id));
  const money = ps.reduce((a,p) => a + 15 + Math.round(p.cod*0.02), 0);
  G.parcels = G.parcels.filter(p => !c.pids.includes(p.id));
  G.stats.issued += ps.length; G.today.issued += ps.length;
  const sat = rate(flowSat(c), c);
  const tip = tipFor(c, sat);
  FLOW = null; closeModal(); removeClient(c);
  addMoney(money + tip); G.today.tips += tip; addXp(10*ps.length);
  sCash();
  toast(`${'⭐'.repeat(Math.round(sat))} +${money} ₴${tip?` · чайові ${tip} ₴ 💝`:''}`, 'good');
}
function finishSend(c){
  const tot = sendTotal(c);
  for (const it of c.items){
    const p = makeParcel({item:ITEM(it.item), state:'outgoing'}); p.w = it.w; p.city = it.city; p.ttn = it.ttn || p.ttn;
  }
  const n = c.items.length;
  G.stats.sent += n; G.today.sent += n;
  const sat = rate(flowSat(c), c);
  const tip = tipFor(c, sat);
  FLOW = null; closeModal(); removeClient(c);
  addMoney(tot.sum + tip); G.today.tips += tip; addXp(12*n);
  sCash();
  toast(`${'⭐'.repeat(Math.round(sat))} +${tot.sum} ₴${tip?` · чайові ${tip} ₴ 💝`:''}`, 'good');
}

/* ---------- дії ---------- */
function act(a, el){
  const id = +el.dataset.id;
  if (['findrow','fetchcell','pay','change','give','packsel','wrap','pack','weigh','weighok','city','print','nina','appscan','proxyok','proxyno','closecell','pickscan','lostsearch','lostpick','open','inspok','inspno','refuse','redirpick','reprint','valpick'].includes(a)) return flowAct(a, el);
  switch(a){
    case 'scanhint': return toast('📟 Затисни штрихкод на посилці, щоб відсканувати');
    case 'serve': return openServe(id || (G.queue.find(c => !c.by)||{}).id);
    case 'reopen': if (FLOW){ FLOW.hidden = false; renderFlow(); } return;
    case 'mclose': if (modalIsFlow && FLOW){ FLOW.hidden = true; closeModal(); dirty = true; } else closeModal(); return;
    case 'startday': return startDay();
    case 'clean': return cleanHall();
    case 'pause': paused = !paused; dirty = true; return;
    case 'speed': G.settings.speed = G.settings.speed === 1 ? 2 : G.settings.speed === 2 ? 3 : 1; dirty = true; return;
    case 'savenow': save(); cloudSave(true).then(ok => toast(ok ? '💾 Збережено (і в хмару)' : '💾 Збережено на пристрої', 'good')); return;
    case 'guide': return showGuide();
    case 'settings': return showSettings();
    case 'take': {
      const p = G.parcels.find(p => p.id === id); if (!p) return;
      if (G.hand === id){ G.hand = null; dirty = true; return; }
      G.hand = id; p.target = targetCell(p);
      if (!p.target) toast('Немає вільних комірок такого розміру — купи стелажі або видавай посилки!', 'bad');
      dirty = true; return;
    }
    case 'cell': {
      const cid = el.dataset.id;
      const hand = G.parcels.find(p => p.id === G.hand);
      if (!hand){
        const ps = G.parcels.filter(p => p.state === 'cell' && p.cell === cid && !p.lost);
        toast(ps.length ? `${cid}: ` + ps.map(p => `${p.e} …${String(p.ttn).slice(-4)}`).join(' ') : `${cid}: порожньо`);
        return;
      }
      if (hand.target === cid){ sScan(); placeParcel(hand, cid); }
      else { sErr(); toast(`Не та комірка! Потрібна ${hand.target}`, 'bad'); }
      return;
    }
    case 'unload': {
      const p = G.parcels.find(p => p.id === id); if (!p || p.state !== 'truck') return;
      const need = G.up.cart ? 1 : p.s>=4?3:p.s===3?2:1;
      p.unl++; beep(400 + p.unl*120, 0.05, 'triangle');
      if (p.unl >= need){ p.state = 'pile'; G.stats.unloaded++; G.today.unloaded++; addXp(1); }
      dirty = true; return;
    }
    case 'unloadall': {
      const ps = G.parcels.filter(p => p.state === 'truck');
      ps.forEach(p => { p.state = 'pile'; G.stats.unloaded++; G.today.unloaded++; });
      G.time += ps.length; toast(`Розвантажено ${ps.length} посилок, пройшло ${ps.length} хв`); dirty = true; return;
    }
    case 'load': { const p = G.parcels.find(p => p.id === id); if (p && p.state === 'outgoing'){ p.state = 'loaded'; beep(500,0.05,'triangle'); addXp(1); } dirty = true; return; }
    case 'role': { const s = G.staff.find(s => s.id === id); if (s){ s.role = el.dataset.role; if (s.cl){ const c = G.queue.find(c => c.id === s.cl); if (c) c.by = null; s.cl = null; } } dirty = true; return; }
    case 'train': {
      const s = G.staff.find(s => s.id === id); if (!s) return;
      const cost = trainCost(s);
      if (G.money < cost) return toast('Не вистачає грошей', 'bad');
      G.money -= cost; s.training = G.day;
      if (s.cl){ const c = G.queue.find(c => c.id === s.cl); if (c) c.by = null; s.cl = null; }
      toast(`📚 ${esc(s.name)} пішов(ла) на навчання до кінця дня ${G.day}`); dirty = true; return;
    }
    case 'fire': {
      const s = G.staff.find(s => s.id === id); if (!s) return;
      if (!confirm(`Звільнити ${s.name}?`)) return;
      if (s.cl){ const c = G.queue.find(c => c.id === s.cl); if (c) c.by = null; }
      G.staff = G.staff.filter(x => x.id !== id); dirty = true; return;
    }
    case 'hire': {
      if (G.staff.length >= staffMax()) return;
      const s = G.cand.find(s => s.id === id); if (!s) return;
      G.cand = G.cand.filter(x => x.id !== id); G.staff.push(s);
      toast(`👋 ${esc(s.name)} тепер працює у вас!`, 'good'); dirty = true; return;
    }
    case 'buy': {
      const k = el.dataset.k, nx = upNext(k); if (!nx || G.level < nx.need || G.money < nx.cost) return;
      G.money -= nx.cost; G.up[k]++; sCash();
      toast(`${UPS[k].e} ${UPS[k].n}: рівень ${G.up[k]}!`, 'good'); save(); dirty = true; return;
    }
    case 'rename': { const v = $('#brname').value.trim(); if (v){ G.branch = v.slice(0,40); save(); cloudSave(true); toast('Збережено', 'good'); dirty = true; } return; }
    case 'sound': G.settings.sound = !G.settings.sound; showSettings(); return;
    case 'copycode': { const t = $('.code').textContent; navigator.clipboard && navigator.clipboard.writeText(t).then(() => toast('Скопійовано', 'good'), () => {}); return; }
    case 'restore': return restoreFromCode($('#rcode').value.trim());
    case 'register': return registerOnline();
    case 'onltab': NET.sub = el.dataset.v; dirty = true; return;
    case 'lbsort': NET.sort = el.dataset.v; NET.top = null; loadTop(); dirty = true; return;
    case 'chatsend': return chatSend();
    case 'player': return showPlayer(el.dataset.id);
    case 'onboard': return onboard();
    case 'regnick': { const n = ($('#regnick').value || '').trim().slice(0,24); if (n.length < 2) return toast('Мінімум 2 символи', 'bad'); closeModal(); return registerOnline(n); }
  }
}

const NET = {ok: !!(CFG.supabaseUrl && CFG.supabaseKey), unread:0, sub:'top', sort:'level', top:null, chat:[], lastId:0, lastCloud:0, ch:null, saving:false};
async function rpc(fn, args){
  if (!NET.ok) throw new Error('offline');
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, {method:'POST', headers:{'Content-Type':'application/json', apikey:CFG.supabaseKey}, body:JSON.stringify(args||{})});
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || t || ('HTTP ' + r.status));
  return j;
}
function randSecret(){ const a = new Uint8Array(24); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2,'0')).join(''); }
function statsPayload(){ return {branch:G.branch, level:G.level, rating:+G.rating.toFixed(2), parcels:G.stats.issued + G.stats.sent, money:Math.round(G.money), staff:G.staff.length, days:G.day - 1}; }
async function cloudSave(force){
  if (!G || !G.pid || NET.saving) return false;
  if (!force && Date.now() - NET.lastCloud < 55000) return false;
  NET.saving = true;
  try {
    save();
    const st = JSON.parse(JSON.stringify(G)); delete st.secret;
    await rpc('np_save', {p_id:G.pid, p_secret:G.secret, p_state:JSON.stringify(st), p_build:GAME_BUILD, p_stats:statsPayload()});
    NET.lastCloud = Date.now(); return true;
  } catch(e){
    if (/outdated game build/.test(e.message)){ save(); location.reload(); }
    return false;
  } finally { NET.saving = false; }
}
async function registerOnline(nickOverride){
  if (!G) return;
  const secret = randSecret();
  try {
    const id = await rpc('np_register', {p_nick: nickOverride || G.nick, p_branch: G.branch, p_secret: secret});
    G.pid = id; G.secret = secret; if (nickOverride) G.nick = nickOverride;
    save(); await cloudSave(true); connectChat();
    toast('🌐 Онлайн підключено!', 'good');
    if ($('#modal .code') || $('#rcode')) showSettings();
    return true;
  } catch(e){
    if (/nick taken/.test(e.message)){
      showModal('🌐 Нікнейм зайнятий', `<p>Нікнейм <b>${esc(nickOverride || G.nick)}</b> вже використовує інший гравець. Придумай інший:</p>
        <input id="regnick" maxlength="24" value="${esc((nickOverride || G.nick) + ri(1,99))}">
        <button class="pri" style="width:100%;margin-top:10px" data-act="regnick">Підключити онлайн</button>
        <div class="mute" style="margin-top:8px">Можна закрити це вікно і підключитись пізніше в ⚙️ налаштуваннях.</div>`);
    } else toast('Не вдалося підключити онлайн. Гра працює офлайн, спробуємо пізніше.', 'bad');
    return false;
  }
}
async function cloudSync(){
  if (!G || !G.pid) return;
  try {
    const r = await rpc('np_load', {p_id:G.pid, p_secret:G.secret});
    NET.admin = !!(r && r.admin);
    if (r && r.build && r.build > GAME_BUILD){ save(); location.reload(); return; }
    if (r && r.state && r.saved_at > (G.savedAt || 0) + 2000){
      const st = migrate(JSON.parse(r.state));
      st.pid = G.pid; st.secret = G.secret;
      G = st; FLOW = null; closeModal(); save();
      toast('☁️ Завантажено новіший прогрес з хмари', 'good');
    }
    NET.lastCloud = Date.now();
    dirty = true;
  } catch(e){ /* офлайн — граємо далі */ }
}
async function restoreFromCode(code){
  try {
    const o = JSON.parse(atob(code.replace(/^NP-/, '').trim()));
    const r = await rpc('np_load', {p_id:o.i, p_secret:o.s});
    if (!r) throw new Error('empty');
    if (!confirm('Замінити поточне відділення на відновлене?')) return;
    let st = r.state ? migrate(JSON.parse(r.state)) : newGame(r.nick, 'Відділення №1');
    st.pid = o.i; st.secret = o.s; st.nick = r.nick;
    G = st; FLOW = null; save(); closeModal(); connectChat();
    toast('✅ Відділення відновлено!', 'good'); dirty = true;
  } catch(e){ toast('Код не підходить', 'bad'); }
}
async function loadTop(){
  try { NET.top = await rpc('np_top', {p_sort: NET.sort}); if (TAB === 'online') dirty = true; } catch(e){ NET.top = NET.top || []; }
}
function connectChat(){
  if (NET.ch || !window.supabase || !NET.ok) return;
  try {
    const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:false, autoRefreshToken:false}});
    NET.ch = sb.channel('np-chat', {config:{broadcast:{self:false}}});
    NET.ch.on('broadcast', {event:'m'}, ({payload}) => addChat([payload]));
    NET.ch.subscribe();
  } catch(e){}
}
function addChat(list){
  let added = 0;
  for (const m of list){
    if (!m || NET.chat.some(x => x.id === m.id)) continue;
    NET.chat.push(m); added++;
    if (m.id > NET.lastId) NET.lastId = m.id;
    if (TAB !== 'online' && NET.loadedOnce && m.from_id !== G.pid) NET.unread++;
  }
  NET.chat.sort((a,b) => a.id - b.id);
  if (NET.chat.length > 120) NET.chat = NET.chat.slice(-120);
  if (added){
    if (TAB === 'online' && NET.sub === 'chat') drawChat();
    else renderTabs();
  }
}
async function chatPoll(){
  try { const r = await rpc('np_chat_recent', {p_after: NET.lastId}); addChat(r || []); NET.loadedOnce = true; } catch(e){}
}
async function chatSend(){
  const inp = $('#chatin'); if (!inp) return;
  const body = inp.value.trim(); if (!body) return;
  if (!G.pid){ toast('Спершу підключи онлайн у налаштуваннях', 'bad'); return; }
  inp.value = '';
  try {
    const id = await rpc('np_chat_send', {p_id:G.pid, p_secret:G.secret, p_body:body});
    const m = {id, at:new Date().toISOString(), from_id:G.pid, nick:G.nick, body:body.slice(0,300)};
    addChat([m]);
    if (NET.ch) NET.ch.send({type:'broadcast', event:'m', payload:m});
  } catch(e){ toast(/too fast/.test(e.message) ? 'Не так швидко 🙂' : 'Не вдалося надіслати', 'bad'); inp.value = body; }
}
function drawChat(){
  const box = $('#chatbox'); if (!box) return;
  box.innerHTML = NET.chat.map(m => `<div class="msg"><b data-nol10n>${esc(m.nick)}</b><span class="t">${new Date(m.at).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})}</span><br>${esc(m.body)}</div>`).join('') || '<div class="mute">Поки тихо. Привітайся першим! 👋</div>';
  box.scrollTop = box.scrollHeight;
}
function viewOnline(){
  const me = `<div class="card"><h3>👤 ${esc(G.nick)}</h3><div class="mute">${G.pid ? '<span class="dot on"></span>Ви онлайн · прогрес зберігається в хмару' : 'Відділення не підключене до онлайну'}</div>
    ${G.pid ? '' : '<button class="pri sm" style="margin-top:6px" data-act="register">🌐 Підключити онлайн</button>'}</div>`;
  const sub = `<div class="subtabs"><button class="${NET.sub==='top'?'on':''}" data-act="onltab" data-v="top">🏆 Рейтинг відділень</button><button class="${NET.sub==='chat'?'on':''}" data-act="onltab" data-v="chat">💬 Чат</button></div>`;
  if (NET.sub === 'chat'){
    return me + sub + `<div class="card"><div class="chat" id="chatbox"></div><div class="row" style="flex-wrap:nowrap"><input id="chatin" maxlength="300" placeholder="Повідомлення…"><button class="pri" data-act="chatsend">➤</button></div></div>`;
  }
  const sorts = [['level','Рівень'],['parcels','Посилки'],['rating','Рейтинг'],['money','Гроші']];
  const top = NET.top;
  const online = top ? top.filter(p => p.online).length : 0;
  return me + sub + `<div class="card"><div class="row" style="margin-bottom:8px">${sorts.map(([k,n]) => `<button class="sm ${NET.sort===k?'pri':''}" data-act="lbsort" data-v="${k}">${n}</button>`).join('')}<span class="sp"></span><span class="mute"><span class="dot on"></span>онлайн: ${online}</span></div>
    ${!top ? '<div class="mute">Завантаження…</div>' : !top.length ? '<div class="mute">Поки нікого. Будь першим!</div>' :
    `<table class="lb"><tr><th>#</th><th>Відділення</th><th>Рів.</th><th>⭐</th><th>📦</th></tr>${top.map((p,i) => `<tr class="${p.id===G.pid?'mine':''}" data-act="player" data-id="${p.id}" style="cursor:pointer">
      <td>${i+1}</td><td><span class="dot ${p.online?'on':''}"></span><b data-nol10n>${esc(p.nickname)}</b><div class="mute" data-nol10n>${esc(p.branch)}</div></td><td>${p.level}</td><td>${(+p.rating).toFixed(2)}</td><td>${fmt(p.parcels)}</td></tr>`).join('')}</table>`}</div>`;
}
function afterOnline(){ if (NET.sub === 'chat') drawChat(); }
function showPlayer(id){
  const p = (NET.top||[]).find(x => x.id === id); if (!p) return;
  const seen = p.online ? '<span class="dot on"></span>зараз онлайн' : `був(ла) ${new Date(p.last_seen).toLocaleString('uk-UA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`;
  showModal(`🏤 ${esc(p.nickname)}`, `<div class="card"><h3 data-nol10n>${esc(p.branch)}</h3><div class="mute">${seen}</div></div>
    <div class="card kv"><span>Рівень</span><b>${p.level}</b><span>⭐ Рейтинг</span><b>${(+p.rating).toFixed(2)}</b>
    <span>📦 Посилок оброблено</span><b>${fmt(p.parcels)}</b><span>💰 Каса</span><b>${fmt(p.money)} ₴</b>
    <span>👥 Персонал</span><b>${p.staff}</b><span>📅 Відпрацьовано днів</span><b>${p.days}</b></div>
    <button class="pri" style="width:100%" data-act="mclose">Закрити</button>`);
}

/* ---------- оновлення гри ---------- */
async function checkVersion(){
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const v = await r.json();
    if (v.build > GAME_BUILD){
      const b = $('#updbar'); b.classList.remove('hidden');
      b.innerHTML = `🆕 Вийшло оновлення гри! <button class="pri sm" onclick="save();location.reload()">Оновити</button>`;
    }
  } catch(e){}
}

/* ---------- старт ---------- */
function onboard(){
  const nick = ($('#obnick').value || '').trim().slice(0,24);
  const br = ($('#obbranch').value || '').trim().slice(0,40) || 'Відділення №1';
  if (nick.length < 2){ toast('Введи нікнейм (мінімум 2 символи)', 'bad'); return; }
  G = newGame(nick, br); save(); closeModal();
  dirty = true;
  registerOnline();
  showGuide();
}
function showOnboard(){
  showModal('📦 Ласкаво просимо в «Наша Пошта»!', `
    <p>Ти — новий оператор маленького пункту видачі. Розвантажуй машини, розкладай посилки по комірках, обслуговуй клієнтів і розвивай своє відділення до справжнього хабу!</p>
    <div class="card"><div class="mute">Твій нікнейм (буде видно в рейтингу і чаті)</div><input id="obnick" maxlength="24" placeholder="Наприклад, Оператор Дмитро">
      <div class="mute" style="margin-top:8px">Назва відділення</div><input id="obbranch" maxlength="40" value="Відділення №1, вул. Центральна"></div>
    <button class="pri" style="width:100%;padding:14px" data-act="onboard">🚀 Почати роботу</button>
    <div class="mute" style="margin-top:10px">Вже грав на іншому пристрої? Відкрий ⚙️ після старту і введи код збереження.</div>`);
  $('#modal .x').classList.add('hidden');
}
function boot(){
  G = loadLocal();
  if (!G){ showOnboard(); G = null; }
  else { cloudSync(); connectChat(); }
  setInterval(tick, 100);
  setInterval(() => { if (G){ save(); } }, 15000);
  setInterval(() => { if (G && G.pid){ cloudSave(); } }, 60000);
  setInterval(() => { if (G && G.pid && TAB === 'online'){ loadTop(); if (NET.sub === 'chat') chatPoll(); } }, 15000);
  setInterval(() => { if (G && G.pid && TAB !== 'online') chatPoll(); }, 45000);
  setInterval(checkVersion, 300000); checkVersion();
  setInterval(() => { if (G && !G.pid && !NET.regTried){ NET.regTried = true; registerOnline(); } }, 120000);
  setTimeout(chatPoll, 1500);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden && G){ save(); cloudSave(true); } });
}
boot();
</script>
</body>
</html>
