<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Наша Пошта — симулятор відділення</title>
<meta name="theme-color" content="#d62828">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Наша Пошта">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="config.js"></script>
<script src="hall3d.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{
  --red:#d62828;--red2:#a4161a;--red3:#fde8e8;--bg:#f1eee9;--card:#fff;--ink:#222;--mute:#777;--line:#e4ddd3;
  --green:#2a9d55;--green2:#e3f5ea;--amber:#e89a00;--amber2:#fff3d6;--blue:#2c6fbb;--blue2:#e6f0fb;--shelf:#c99a63;--shelf2:#8a6239;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:#ece7df;color:var(--ink);transition:transform .08s,filter .15s}
button:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.pri{background:var(--red);color:#fff;font-weight:600}
button.ok{background:var(--green);color:#fff;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line)}
button.sm{padding:5px 10px;font-size:13px;border-radius:8px}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.hidden{display:none!important}
#app{max-width:1100px;margin:0 auto;padding-bottom:70px}
/* header */
#top{background:linear-gradient(180deg,var(--red),var(--red2));color:#fff;padding:8px 12px 10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0003}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.logo .lbox{background:#fff;color:var(--red);border-radius:7px;padding:1px 6px;font-size:14px}
.branch{opacity:.9;font-size:13px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.pill{background:#ffffff22;border-radius:20px;padding:3px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.topbtn{background:#ffffff22;color:#fff;padding:5px 9px;border-radius:9px;font-size:15px}
.xpbar{height:5px;background:#ffffff33;border-radius:4px;margin-top:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#ffd166;width:0;transition:width .3s}
.clock{font-variant-numeric:tabular-nums}
/* tabs */
#tabs{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;position:sticky;top:0;z-index:15;background:var(--bg)}
#tabs button{white-space:nowrap;background:#fff;border:1px solid var(--line);font-weight:600;position:relative}
#tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:700}
@media(max-width:700px){#toasts{top:auto;bottom:78px}#updbar{bottom:130px}
  #top{padding:6px 8px 7px}.toprow{gap:5px}.pill{font-size:12px;padding:2px 7px}.topbtn{padding:3px 6px;font-size:13px}.branch{display:none}.logo{font-size:15px}
  #tabs{position:fixed;bottom:0;top:auto;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px;justify-content:space-between;gap:2px}
  #tabs button{flex:1;padding:6px 2px;font-size:11px;border:0;display:flex;flex-direction:column;align-items:center;background:transparent}
  #tabs button .ti{font-size:20px}#tabs button.on{background:var(--red3);color:var(--red2)}}
@media(min-width:701px){#tabs button .ti{margin-right:4px}}
@media(max-width:700px){.topbtn.hm{display:none}}
main{padding:4px 10px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px #0000000d;border:1px solid var(--line)}
.card h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:6px}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
/* queue */
.queue{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;min-height:120px;align-items:flex-end}
.client{min-width:96px;max-width:96px;background:#faf8f5;border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;position:relative;animation:walkin .5s ease-out}
.client.reg{border-color:var(--amber);background:var(--amber2)}
.client.me{outline:2px solid var(--red)}
.client .av{font-size:34px;line-height:1.1}
.client .nm{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client .kd{font-size:11px;color:var(--mute)}
.client .who{font-size:10px;color:var(--blue);font-weight:600}
.pat{height:5px;background:#e9e4dc;border-radius:3px;margin-top:4px;overflow:hidden}
.pat i{display:block;height:100%;background:var(--green);transition:width .25s linear}
@keyframes walkin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.windows{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.win{border:2px dashed var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff}
.win.act{border-style:solid;border-color:var(--red)}
.win .wt{font-weight:700;font-size:13px;margin-bottom:6px}
.counter{background:linear-gradient(180deg,#e8e2d8,#d9d0c3);height:14px;border-radius:0 0 8px 8px;margin:-2px 0 10px}
.bigstart{text-align:center;padding:26px 12px}
.bigstart .e{font-size:60px}
/* shelves */
.racks{display:flex;flex-wrap:wrap;gap:10px}
.rack{background:var(--shelf2);padding:5px;border-radius:8px}
.rack .rt{color:#fff;font-size:11px;font-weight:700;text-align:center;margin-bottom:3px}
.rack .cells{display:grid;grid-template-columns:repeat(4,46px);gap:4px}
.rack.big .cells{grid-template-columns:repeat(2,70px)}
.cell{background:var(--shelf);border-radius:5px;height:46px;padding:2px;font-size:10px;font-weight:700;color:#3d2a15;display:flex;flex-direction:column;justify-content:space-between;align-items:center;border:2px solid transparent}
.rack.big .cell{height:58px}
.cell .dots{font-size:13px;line-height:1;letter-spacing:-2px}
.cell.glow{border-color:#ffd60a;box-shadow:0 0 10px #ffd60a;animation:pulse 1s infinite}
.cell.full{filter:saturate(.4) brightness(.9)}
.cell.picked{background:#9bd3a8}
@keyframes pulse{50%{box-shadow:0 0 2px #ffd60a}}
.pile{display:flex;flex-wrap:wrap;gap:6px}
.parcel{background:#d8b384;border:1px solid #b08a5c;color:#3d2a15;border-radius:8px;padding:5px 7px;font-size:12px;min-width:70px;text-align:center;position:relative}
.parcel .pe{font-size:20px}
.parcel.sel{outline:3px solid var(--red);transform:translateY(-3px)}
.parcel.s3,.parcel.s4{background:#c69c6d}
.parcel .tag{font-size:9px;font-weight:700}
.fr{color:var(--red2)}
.terminal{background:#1d2b24;color:#7dffb0;font-family:ui-monospace,Consolas,monospace;border-radius:10px;padding:10px;font-size:13px;margin-bottom:8px;min-height:44px}
.terminal b{color:#fff}
/* truck */
.truck{background:#fff;border-radius:14px;border:1px solid var(--line);padding:10px;position:relative;overflow:hidden}
.truckbody{background:linear-gradient(180deg,#f8f8f8,#e8e8e8);border:3px solid #bbb;border-radius:10px;padding:8px;min-height:130px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;position:relative}
.truckbody::before{content:"НАША ПОШТА";position:absolute;right:10px;bottom:6px;color:var(--red);font-weight:900;opacity:.18;font-size:26px;pointer-events:none}
.truckcab{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.truckcab .te{font-size:40px;animation:drive .6s ease-out}
@keyframes drive{from{transform:translateX(-80px)}to{transform:none}}
.box{background:#d8b384;border:1px solid #9c7646;border-radius:6px;width:58px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#3d2a15;position:relative}
.box.s3{width:74px;height:60px}.box.s4{width:90px;height:68px;background:#c49562}
.box .pr{position:absolute;bottom:2px;left:4px;right:4px;height:4px;background:#0002;border-radius:2px;overflow:hidden}
.box .pr i{display:block;height:100%;background:var(--green)}
.timer{font-weight:700;color:var(--red2)}
/* staff & upgrades */
.staff{display:flex;gap:10px;align-items:flex-start}
.staff .av{font-size:38px}
.stars{color:var(--amber);letter-spacing:-1px}
.roles{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.roles button{padding:4px 8px;font-size:12px}
.roles button.on{background:var(--ink);color:#fff}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.up .ue{font-size:30px}
.lvl{display:flex;gap:3px;margin:6px 0}
.lvl i{flex:1;height:6px;border-radius:3px;background:#e9e4dc}
.lvl i.on{background:var(--green)}
/* modal */
#modal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}
.mbox{background:var(--bg);border-radius:16px;max-width:640px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 10px 40px #0005}
.mhead{background:var(--red);color:#fff;padding:10px 14px;border-radius:16px 16px 0 0;display:flex;align-items:center;gap:8px;font-weight:700;position:sticky;top:0;z-index:2}
.mhead .x{margin-left:auto;background:#ffffff33;color:#fff;padding:4px 10px}
.mbody{padding:12px}
.bubble{background:#fff;border-radius:14px;padding:10px 12px;border:1px solid var(--line);position:relative;margin:4px 0 10px 54px}
.bubble::before{content:"";position:absolute;left:-8px;top:14px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.speaker{display:flex;align-items:flex-start;gap:0;position:relative}
.speaker .av{font-size:40px;position:absolute;left:0;top:0}
.steps{display:flex;gap:4px;margin-bottom:10px}
.steps i{flex:1;height:5px;border-radius:3px;background:#ddd5ca}
.steps i.on{background:var(--red)}
.trow{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid #2f4a3c;margin-bottom:5px}
.trow:hover{background:#2a3d33}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.opts button{padding:12px 6px}
.opts button.on{background:var(--ink);color:#fff}
.itemcard{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:10px;border:1px solid var(--line);margin-bottom:10px}
.itemcard .ie{font-size:48px}
.scale{text-align:center;padding:14px}
.scale .disp{display:inline-block;background:#1d2b24;color:#7dffb0;font-family:ui-monospace,monospace;font-size:30px;padding:6px 18px;border-radius:8px;min-width:150px}
.ttn{background:#fff;border:2px dashed #999;border-radius:8px;padding:10px;font-family:ui-monospace,monospace;text-align:center}
.ttn .bar{font-size:26px;letter-spacing:-1px;line-height:1}
/* toasts */
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:94%;max-width:420px}
.toast{background:#222d;color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;animation:tin .25s ease-out;text-align:center;backdrop-filter:blur(4px)}
.toast.good{background:#1f7a43e8}.toast.bad{background:#a4161ae8}.toast.gold{background:#b07a00ee}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#updbar{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 12px;border-radius:12px;z-index:40;display:flex;gap:10px;align-items:center}
/* online */
.lb{width:100%;border-collapse:collapse;font-size:14px}
.lb td,.lb th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.lb tr.mine{background:var(--amber2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;margin-right:4px}
.dot.on{background:#2fbf63;box-shadow:0 0 6px #2fbf63}
.chat{height:340px;overflow-y:auto;background:#faf8f5;border-radius:10px;padding:8px;border:1px solid var(--line);margin-bottom:8px}
.msg{margin-bottom:6px}.msg b{color:var(--red2)}.msg .t{color:var(--mute);font-size:11px;margin-left:4px}
.subtabs{display:flex;gap:6px;margin-bottom:10px}
.subtabs button.on{background:var(--ink);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv b{text-align:right}
.hearts{color:var(--red);font-size:12px}
.code{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line)}
.guide li{margin-bottom:6px}
/* анімований зал */
#scene{position:relative;height:150px;border-radius:12px;overflow:hidden;margin-bottom:8px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--wallc,#f1eee9) 0,var(--wallc,#f1eee9) 34%,#cdbfa9 34%,#cdbfa9 36%,#e9e0d2 36%),repeating-linear-gradient(90deg,#0000 0 39px,#0000000d 39px 40px)}
#scene .door{position:absolute;right:6px;top:8px;font-size:44px}
#scene .deco{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:20px;display:flex;gap:6px;opacity:.9}
#scene .wins{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:2px}
#scene .wn{font-size:13px;background:#ffffffcc;border-radius:8px;padding:1px 6px;display:flex;align-items:center;gap:3px;border:1px solid var(--line)}
#scene .wn b{font-size:20px}
.spr{position:absolute;font-size:30px;line-height:1;transition:left 1.4s linear,top 1.4s linear,opacity .6s;cursor:pointer;text-align:center;transform:translateX(-50%)}
.spr.walk .face{animation:bob .35s ease-in-out infinite}
.spr .carry{position:absolute;right:-12px;bottom:-2px;font-size:17px}
.spr .mood{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:13px}
.spr.reg .face{filter:drop-shadow(0 0 3px #e89a00)}
@keyframes bob{50%{transform:translateY(-4px)}}
#scene.s3d{height:clamp(250px,46vw,380px);background:#2b2f36}
#scene .h3d{display:block;width:100%;height:100%;cursor:grab}
#scene .h3dctl{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
#scene .h3dctl button{width:32px;height:32px;padding:0;border-radius:8px;border:1px solid #ffffff55;background:#00000066;color:#fff;font-size:17px;line-height:1}
#scene .h3dctl button.on{background:#d7262bcc;border-color:#fff}
@media (max-width:520px){#scene .h3dctl{gap:3px;right:4px;bottom:4px}#scene .h3dctl button{width:27px;height:27px;font-size:14px;border-radius:7px}}
#scene .h3dhint{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#000000a0;color:#fff;font-size:12px;padding:4px 10px;border-radius:10px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;transition:opacity .6s}
#scene .h3dhint[hidden]{display:block;opacity:0}
.visit{margin-top:8px}.visit .vq{display:flex;gap:6px;font-size:28px;justify-content:center;min-height:36px}.visit .vw{display:flex;gap:10px;justify-content:center;font-size:24px;flex-wrap:wrap}
.decor{display:flex;gap:6px;font-size:24px;justify-content:flex-end;margin:-4px 0 -6px;flex-wrap:wrap}
.traits{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0}.traits span{background:var(--blue2);color:var(--blue);border-radius:8px;padding:1px 6px;font-size:12px;font-weight:600}
.mbars{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 6px;align-items:center;font-size:12px;color:var(--mute);max-width:420px}.mbars .lvl{margin:0}
.task{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}.task.done{background:var(--green2)}.task .lvl{margin:4px 0 0}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.ach{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;opacity:.6}.ach.got{opacity:1;background:var(--amber2)}.ach .ae{font-size:30px}
.badge2{background:var(--amber2);border:1px solid var(--amber);border-radius:10px;padding:3px 8px;font-size:13px}
.banner{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.banner.ev{border-left-color:var(--amber);background:var(--amber2)}.banner.insp{border-left-color:var(--red);background:var(--red3)}.banner.dark{border-left-color:#000;background:#2b2b2b;color:#eee}
#dark{position:fixed;inset:0;pointer-events:none;z-index:55;background:radial-gradient(circle 190px at var(--fx,50%) var(--fy,45%),transparent 0,transparent 55%,rgba(5,5,15,.8) 100%)}

/* сканер штрихкодів */
.bc{position:relative;display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:1px solid #bbb;border-radius:6px;padding:4px 6px 2px;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
.bc .bars{display:flex;align-items:stretch;height:30px;gap:1px}
.bc .bars i{display:block;background:#111}
.bc .bn{font:10px ui-monospace,monospace;color:#333;letter-spacing:.5px}
.bc::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#ff1f1f;box-shadow:0 0 8px #ff1f1f;opacity:0}
.bc.scanning::after{opacity:1;animation:laser .35s linear infinite}
.bc.scanned{outline:3px solid var(--green)}
@keyframes laser{0%{top:8%}50%{top:88%}100%{top:8%}}
.parcel .bc{margin-top:3px;padding:2px 3px 0}.parcel .bc .bars{height:16px}.parcel .bc .bn{font-size:8px}
.cellbox{background:#f6efe5;border:2px solid var(--shelf);border-radius:10px;padding:10px;margin:8px 0}
.phonebox{display:inline-block;background:#222;border-radius:18px;padding:10px 8px;margin:4px 0 10px 54px}
.phonebox .scr{background:#fff;border-radius:10px;padding:8px;text-align:center;font-size:12px}
.doc{background:#fffdf3;border:1px solid #d9cfae;border-radius:8px;padding:10px;font-family:Georgia,serif;font-size:14px;margin-bottom:10px;box-shadow:2px 2px 0 #0001}
.doc .stamp{display:inline-block;border:2px solid #2c6fbb;color:#2c6fbb;border-radius:50%;padding:6px 8px;font-size:10px;transform:rotate(-12deg);font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sgrid button{background:#d8b384;border:1px solid #9c7646;padding:8px 2px;font-size:12px;color:#3d2a15}
.sgrid button .pe{font-size:22px;display:block}
.sgrid button.no{opacity:.35}
.opened{font-size:46px;text-align:center;padding:6px}
  .opav{position:relative;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--uc);flex:none;margin-top:10px;font-style:normal}
  .opav i{font-style:normal}
  .opav .face{font-size:28px;line-height:1}
  .opav .hat{position:absolute;top:-14px;font-size:22px}
  .opav .bdg{position:absolute;bottom:-8px;background:#fff;color:#222;font-size:9px;font-weight:700;padding:0 4px;border-radius:4px;border:1px solid var(--uc);white-space:nowrap;max-width:70px;overflow:hidden}
  .opav.big{width:72px;height:72px;margin:16px 8px 8px}
  .opav.big .face{font-size:44px}
  .opav.big .hat{top:-20px;font-size:34px}
  .opav.big .bdg{font-size:11px;bottom:-10px;max-width:90px}
  .sched{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:6px}
  .sched .mute{margin-right:4px;font-size:12px}
  .sched button{padding:3px 7px;font-size:12px;min-width:0;border-radius:8px}
  .sched button.offd{opacity:.45;text-decoration:line-through}
  .sched button.today{outline:2px solid var(--red)}
  .sst{margin-top:4px;font-size:13px;font-weight:600}
  .sst.bad{color:var(--red)}

function migrate(g){
  const d = newGame(g.nick || 'Оператор', g.branch || 'Відділення №1');
  for (const k in d) if (g[k] === undefined) g[k] = d[k];
  for (const k in d.up) if (g.up[k] === undefined) g.up[k] = d.up[k];
  for (const k in d.stats) if (g.stats[k] === undefined) g.stats[k] = d.stats[k];
  for (const k in d.today) if (g.today[k] === undefined) g.today[k] = d.today[k];
  for (const k in d.settings) if (g.settings[k] === undefined) g.settings[k] = d.settings[k];
  // клієнти, яких обслуговував гравець, повертаються в чергу
  g.queue.forEach(c => { if (c.by === 'me') c.by = null; });
  g.staff.forEach(s => { if (s.cl && !g.queue.some(c => c.id === s.cl)) s.cl = null; });
  return g;
}

const lockerCap = (l=G.up.locker) => [0,12,20,30][l] || 0;

function lockerLoadOne(){
  if (!G.up.locker || lockerN() >= lockerCap()) return false;
  const p = readyParcels().find(p => p.s <= 2 && !p.gift && !p.lost && !p.reg);
  if (!p) return false;

function cellsList(){
  const small = [], big = [];
  const n = smallCount();
  for (let i=0;i<n;i++) small.push(`${Math.floor(i/8)+1}-${pad(i%8+1)}`);
  for (let i=0;i<bigCount();i++) big.push(`Г-${pad(i+1)}`);
  return {small, big};
}
function cellLoad(){
  const m = {};
  for (const p of G.parcels) if (p.state === 'cell') m[p.cell] = (m[p.cell]||0) + 1;
  return m;
}
function targetCell(p){
  const {small, big} = cellsList();
  const list = smallCell(p.s) ? small : big;
  const cap = smallCell(p.s) ? 3 : 2;
  const load = cellLoad();
  let best = Infinity, opts = [];
  for (const c of list){ const l = load[c]||0; if (l >= cap) continue; if (l < best){ best = l; opts = [c]; } else if (l === best) opts.push(c); }
  return opts.length ? pick(opts) : null;
}

/* ---------- щоденні завдання і досягнення ---------- */
function genTasks(){
  const pool = shuffle(TASK_T.filter(t => (t.k !== 'regs' || G.level >= 2) && (t.k !== 'insp' || G.level >= 3) && (t.k !== 'intl' || G.level >= 3) && (!['mis','track','sms'].includes(t.k) || G.level >= 2) && (t.k !== 'courier' || G.staff.some(s => s.role === 'courier')) && (!['fraud','refuse','lost','insp','claim','intl','cod','mis','track','sms'].includes(t.k) || Math.random() < 0.5))).slice(0, 3);
  G.tasks = pool.map(t => { const i = ri(0, t.n.length - 1); return {k:t.k, n:t.n[i], r:t.r[i], prog:0, done:false}; });
}
function taskText(t){ return TASK_T.find(x => x.k === t.k).t.replace('{n}', fmt(t.n)); }
function countTask(k, n, set){
  if (!G || !G.tasks) return;
  for (const t of G.tasks){
    if (t.k !== k || t.done) continue;
    t.prog = set ? Math.max(t.prog, n) : t.prog + n;
    if (t.prog >= t.n){
      t.done = true; G.stats.tasks = (G.stats.tasks||0) + 1;
      G.money += t.r; G.stats.earned += t.r; addXp(Math.round(t.r/10));
      sCash(); toast(`🎯 Завдання виконано: «${taskText(t)}» · +${fmt(t.r)} ₴`, 'gold');
    }
  }
  dirty = true;
}
function checkAch(){
  if (!G) return;
  for (const a of ACH){
    const v = a.g(), got = G.ach[a.k] || 0;
    let tier = got; while (tier < a.t.length && v >= a.t[tier]) tier++;
    if (tier > got){
      G.ach[a.k] = tier;
      const rew = 300 * tier * tier;
      G.money += rew; G.stats.earned += rew;
      sCash(); toast(`🏆 Досягнення «${a.e} ${a.n}» ${'★'.repeat(tier)} · +${fmt(rew)} ₴`, 'gold');
    }
  }
}
function rankReady(){
  const nx = RANKS[G.rank + 1]; if (!nx) return false;
  const n = nx.need, par = G.stats.issued + G.stats.sent;
  return G.level >= n.level && par >= n.parcels && (!n.rating || G.rating >= n.rating) && (!n.branches || 1 + G.others.length >= n.branches);
}

/* ---------- звук ---------- */
let AC = null;
function beep(f=1800, d=0.08, type='square', v=0.05){
  if (!G || !G.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(AC.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.stop(AC.currentTime + d + 0.02);
  } catch(e){}
}
const sScan = () => beep(1900, 0.09);
const sErr = () => beep(180, 0.25, 'sawtooth', 0.06);
const sCash = () => { beep(1320, 0.08, 'triangle', 0.08); setTimeout(() => beep(1760, 0.15, 'triangle', 0.08), 90); };
const sBell = () => { beep(880, 0.2, 'sine', 0.06); };
const sDoor = () => { beep(1568, 0.25, 'sine', 0.025); setTimeout(() => beep(1175, 0.35, 'sine', 0.02), 140); };
function noiseBuf(sec){
  const b = AC.createBuffer(1, AC.sampleRate*sec, AC.sampleRate), d = b.getChannelData(0);
  let last = 0; for (let i=0;i<d.length;i++){ const w = Math.random()*2-1; last = (last + 0.02*w)/1.02; d[i] = last*3.5; }
  return b;
}
// принтер ТТН: «д-р-р-р-р»
function sPrinter(){
  if (!G || !G.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const src = AC.createBufferSource(); src.buffer = noiseBuf(1.2);
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 3;
    const g = AC.createGain(); g.gain.value = 0;
    const t0 = AC.currentTime;
    for (let i=0;i<22;i++){ g.gain.setValueAtTime(0.35, t0 + i*0.045); g.gain.setValueAtTime(0.05, t0 + i*0.045 + 0.028); }
    g.gain.setValueAtTime(0, t0 + 1.0);
    src.connect(bp); bp.connect(g); g.connect(AC.destination); src.start(); src.stop(t0 + 1.1);
  } catch(e){}
}
// «Наступний!» голосом (якщо браузер уміє), інакше — дзвіночок
function sayNext(){
  if (!G || !G.settings.sound) return;
  if (G.settings.voice !== false && window.speechSynthesis){
    try {
      const u = new SpeechSynthesisUtterance(pick(['Наступний!','Наступний, будь ласка!','Підходьте!']));
      u.lang = 'uk-UA'; u.rate = 1.05; u.volume = 0.9;
      const v = speechSynthesis.getVoices().find(v => /^uk/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^(ru|pl)/i.test(v.lang));
      if (v) u.voice = v;
      if (speechSynthesis.getVoices().some(v => /^uk/i.test(v.lang)) || !speechSynthesis.getVoices().length){ speechSynthesis.cancel(); speechSynthesis.speak(u); return; }
    } catch(e){}
  }
  beep(988, 0.12, 'sine', 0.06); setTimeout(() => beep(784, 0.25, 'sine', 0.06), 150);
}
// фоновий шум відділення: гул залу + гомін черги
const AMB = {on:false, g:null, murmur:null};
function ambientStart(){
  if (AMB.on || !G || !G.settings.sound || G.settings.ambient === false) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const src = AC.createBufferSource(); src.buffer = noiseBuf(4); src.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    AMB.g = AC.createGain(); AMB.g.gain.value = 0;
    src.connect(lp); lp.connect(AMB.g); AMB.g.connect(AC.destination); src.start();
    const m = AC.createBufferSource(); m.buffer = noiseBuf(3); m.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = 1.4;
    AMB.murmur = AC.createGain(); AMB.murmur.gain.value = 0;
    m.connect(bp); bp.connect(AMB.murmur); AMB.murmur.connect(AC.destination); m.start();
    AMB.on = true; AMB.srcs = [src, m];
  } catch(e){}
}
function ambientStop(){ if (!AMB.on) return; try { AMB.srcs.forEach(x => x.stop()); } catch(e){} AMB.on = false; }
function ambientTick(){
  if (!AMB.on || !AC) return;
  const want = G && G.phase === 'day' && !paused && G.settings.sound && G.settings.ambient !== false && !document.hidden;
  const t = AC.currentTime;
  AMB.g.gain.setTargetAtTime(want ? 0.05 : 0, t, 0.5);
  const q = want ? Math.min(1, G.queue.length/8) : 0;
  AMB.murmur.gain.setTargetAtTime(q * (0.05 + 0.04*Math.sin(t*1.7)*Math.sin(t*0.6)), t, 0.3);
}
document.addEventListener('pointerdown', () => ambientStart(), {once:false, passive:true});

/* ---------- сканер штрихкодів ---------- */
function barsFor(code){
  const d = String(code).replace(/\D/g,'') || '0';
  let h = '<i style="width:2px"></i><i style="width:1px"></i>';
  for (let k=0;k<d.length;k++){ const n = +d[k]; h += `<i style="width:${1+(n%3)}px;margin-right:${1+((n*7)%3)}px"></i>`; }
  return h + '<i style="width:1px"></i><i style="width:2px"></i>';
}
// затисни (або наведи мишку) на штрихкод ~0,35 с — «пік»
function bcHTML(code, scanAct, v, small){
  return `<div class="bc" data-scan="${scanAct}" data-id="${esc(v)}" data-v="${esc(v)}"><div class="bars">${barsFor(code)}</div><div class="bn">${small ? '…' + String(code).slice(-6) : esc(code)}</div></div>`;
}
const SCAN = {el:null, t:0, last:0};
function scanStart(el){
  if (SCAN.el === el) return;
  scanStop();
  SCAN.el = el; el.classList.add('scanning');
  const ms = ((G && G.up.scanner >= 1) ? 280 : 380) * (scanSlow() ? 3 : 1);
  SCAN.t = setTimeout(() => {
    const e = SCAN.el; scanStop(); if (!e || !e.isConnected) return;
    e.classList.add('scanned'); sScan(); SCAN.last = performance.now();
    if (G && G.phase === 'day' && !manualMode() && G.sup.bat > 0){ G.sup.bat -= 0.6; if (G.sup.bat <= 0){ G.sup.bat = 0; toast('🪫 Сканер розрядився — номери вводиш вручну. Постав його на зарядку в 🧰', 'bad'); } else if (G.sup.bat < 15 && !G.sup.lowBat){ G.sup.lowBat = 1; toast('🔋 Сканер майже розряджений!'); } }
    act(e.dataset.scan, e);
  }, ms);
}
function scanStop(){ if (SCAN.el) SCAN.el.classList.remove('scanning'); clearTimeout(SCAN.t); SCAN.el = null; }
document.addEventListener('pointerdown', e => { const b = e.target.closest('.bc'); if (b){ e.preventDefault(); scanStart(b); } });
document.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const b = e.target.closest('.bc'); if (b) scanStart(b); });
document.addEventListener('pointerout', e => { const b = e.target.closest('.bc'); if (b && SCAN.el === b && !b.contains(e.relatedTarget)) scanStop(); });
document.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') scanStop(); });
document.addEventListener('pointercancel', scanStop);

/* ---------- тости ---------- */
function toast(t, cls=''){
  const d = document.createElement('div');
  d.className = 'toast ' + cls; d.innerHTML = t;
  $('#toasts').appendChild(d);
  setTimeout(() => d.remove(), 2600);
  while ($('#toasts').children.length > 4) $('#toasts').firstChild.remove();
}

/* ---------- генерація ---------- */
function phone(){ return `${pick(OPS)} ${ri(100,999)} ${pad(ri(0,99))} ${pad(ri(0,99))}`; }
function ttn(){ return '2045' + ri(1000000000, 9999999999); }
function person(){
  const f = Math.random() < 0.5;
  return {name: `${pick(f?NAMES_F:NAMES_M)} ${'АБВГДЗКЛМНОПРСТФШ'[ri(0,16)]}.`, av: pick(f?AV_F:AV_M)};
}
function regInfo(id){
  if (!G.regs[id]) G.regs[id] = {met:false, hearts:0, visits:0, phone:phone()};
  return G.regs[id];
}
function makeParcel(opts={}){
  const it = opts.item || pickItem();
  const p = {id:G.nid++, ttn:ttn(), item:it.n, e:it.e, s:it.s, w:+rnd(it.w[0], it.w[1]).toFixed(1), f:it.f?1:0,
    cod: Math.random() < 0.4 ? ri(2,40)*25 : 0, phone: opts.phone || phone(), name: opts.name || person().name,
    city: pick(CITIES), from: pick(CITIES), state: opts.state || 'truck', cell:null, reg: opts.reg || null, unl:0, inDay:0, inT:0};
  G.parcels.push(p);
  return p;
}
function truckArrive(kind){
  const leave = {m:600, x:720, d:870, e:1185}[kind];
  if (kind === 'e'){
    G.truck = {kind:'out', leaveAt:leave, key:kind};
    sBell(); toast('🚚 Приїхала вечірня машина — завантаж відправлення!', 'gold');
  } else {
    let n = ri(6,9) + G.level + G.up.tier*4;
    if (kind === 'd') n = Math.max(3, Math.round(n*0.6));
    if (kind === 'x') n = Math.max(4, Math.round(n*0.7));
    const ev = curEvent(); if (ev) n = Math.round(n*ev.truck);
    const se = curSeason(); if (se) n = Math.round(n*se.truck);
    const ids = [];
    // посилки постійним клієнтам
    for (const r of REGS) if (r.kind === 'get' && G.level >= r.lvl && Math.random() < 0.4){
      const ri_ = regInfo(r.id);
      const it = r.big ? pick(ITEMS.filter(i => i.s >= 3)) : pick(ITEMS.filter(i => i.s <= 2));
      ids.push(makeParcel({item:it, phone:ri_.phone, name:r.n, reg:r.id}).id);
    }
    if (kind === 'm' || kind === 'd') giftParcels().forEach(id => ids.push(id));
    if (kind === 'm'){ for (const e of G.expect || []) ids.push(Object.assign(makeParcel({phone:e.phone, name:e.name}), {back:1}).id); G.expect = []; }
    for (let i=0;i<n;i++){
      const p = makeParcel();
      ids.push(p.id);
      if (G.level >= 2 && Math.random() < 0.05){ p.mis = {br: ri(2, 99), city: pick(CITIES)}; continue; }
      if (G.level >= 4 && p.s <= 3 && G.staff.some(s => s.role === 'courier') && Math.random() < 0.18) p.addr = {x: ri(5, 95), y: ri(5, 78), st: `${pick(ADDR_ST)}, ${ri(1, 120)}`};
      if (Math.random() < 0.15 && i < n-1){ ids.push(makeParcel({phone:p.phone, name:p.name}).id); i++; }
    }
    G.truck = {kind:'in', leaveAt:leave, key:kind};
    sBell(); toast(`🚚 Приїхала ${kind === 'x' ? 'додаткова ' : ''}машина: ${ids.length} посилок на розвантаження!`, 'gold');
  }
  G.trucksDone[kind] = 1;
  dirty = true;
}
function truckLeave(){
  const t = G.truck; if (!t) return;
  if (t.kind === 'in'){
    const left = G.parcels.filter(p => p.state === 'truck');
    if (left.length){
      G.parcels = G.parcels.filter(p => p.state !== 'truck');
      G.rating = clamp(G.rating - 0.03*left.length, 1, 5);
      G.today.returned += left.length;
      toast(`😬 Машина поїхала, ${left.length} посилок не розвантажено — повертаються на сортування`, 'bad');
    }
  } else {
    const loaded = G.parcels.filter(p => p.state === 'loaded').length;
    G.parcels = G.parcels.filter(p => p.state !== 'loaded');
    const notL = G.parcels.filter(p => p.state === 'outgoing').length;
    if (notL){ G.rating = clamp(G.rating - 0.02*notL, 1, 5); toast(`🚚 Поїхала з ${loaded} відправленнями. Залишилось ${notL} — поїдуть завтра (рейтинг ↓)`, 'bad'); }
    else if (loaded) toast(`🚚 Машина поїхала: ${loaded} відправлень в дорозі!`, 'good');
  }
  G.truck = null; dirty = true;
}

/* ---------- клієнти ---------- */
function readyParcels(){
  const cour = G.staff.some(s => s.role === 'courier');
  return G.parcels.filter(p => p.state === 'cell' && !p.res && !p.mis && (!p.addr || !cour) && (p.inDay < G.day || G.time - p.inT >= 20));
}
function spawnClient(force){
  if (G.queue.length >= queueMax()) return;
  const avail = readyParcels();
  const gp = avail.find(p => p.gift);
  if (gp && !G.queue.some(c => c.gift) && Math.random() < 0.5){
    const group = avail.filter(p => p.gift);
    const c = {id:G.cid++, kind:'get', name:G.nick, av:'🙋', reg:null, by:null, pids:group.map(p => p.id), items:[], gift:true, card:true, phone:gp.phone, app:true,
      hi:`Це ж я! 😄 Мені подарунок прийшов від <b>${esc(gp.gift.from)}</b>!`};
    c.max = c.pat = 200; group.forEach(p => p.res = c.id);
    G.queue.push(c); dirty = true; return;

function staffFinish(s, forceErr){

    planAdd('shop', money);
    if (!c.card || manualMode()) G.today.cashIn += money;
    removeClient(c); rate(err ? 2 : 4, c); addMoney(money); addXp(4);

  }
  if (c.kind === 'info'){

      G.rating = clamp(G.rating - 0.15, 1, 5); toast(`😱 ${esc(s.name)} видав(ла) посилку шахраю! Рейтинг ↓`, 'bad');
    }
    if (c.inspect && c.inspect.bad){ const bp = ps.find(p => p.id === c.inspect.pid); if (bp){ returnParcel(bp); ps = ps.filter(p => p !== bp); money += 15; } }
    n += ps.length; codCash = ps.reduce((a,p) => a + p.cod, 0);
    money += ps.reduce((a,p) => a + 15 + Math.round(p.cod*0.02), 0);
    if (!c.redir){ const fee = ps.reduce((a,p) => a + storeFee(p), 0); money += fee; codCash += fee; }
    G.parcels = G.parcels.filter(p => !ps.includes(p));
    G.stats.issued += ps.length; G.today.issued += ps.length;
    n = Math.max(n, 1);
  } else {
    if (c.biz){ money = (BIZ[c.biz] || {rate:80}).rate * c.items.length / 0.9; G.stats.bizSent = (G.stats.bizSent||0) + c.items.length; }
    for (const it of c.items){
      if (c.biz){ const p = makeParcel({item:{n:it.item, e:it.e, s:it.s, w:[it.w,it.w], f:it.f}, state:'outgoing'}); p.city = it.city; p.cod = 0; n++; continue; }
      if (it.ban && !err) continue; // працівник не прийняв заборонене
      const pk = PACK.find(x => x.k === (it.packed ? 9 : it.s)) || PACK[0];
      const pp = isBig(it) ? BIGPACK.find(b => b.k === bigPackRight(it)).price : it.s >= 4 ? 0 : pk.price;
      money += itemBase(it) + (it.intl ? 0 : valFee(it.val)) + pp + codFee(it.cod);
      planAdd('pack', pp); if (it.val && !it.intl) planAdd('ins', 1);
      const p = makeParcel({item:{n:it.item, e:it.e, s:it.s, w:[it.w,it.w], f:it.f}, state:'outgoing'}); p.w = it.w; p.city = it.city; p.intl = it.intl || null; p.cod = 0;
      n++;

    G.stats.sent += n; G.today.sent += n;
    if (!n){ removeClient(c); addXp(3); return; }
    if (!labelsUse(n, true)){ err = true; toast(`🧾 ${esc(s.name)}: закінчилась термострічка — ТТН виписано від руки`, 'bad'); }
  }
  if (!c.biz && (!c.card || manualMode())){
    const cash = c.kind === 'get' ? codCash + (c.redir && c.redir.type !== 'back' ? REDIR_FEE : 0) : money;
    G.today.cashIn += cash;
    if (err && Math.random() < 0.5) G.today.short += ri(1,6)*10;
  }
  removeClient(c);
  const sat = rate((err ? 2 : 4 + (Math.random() < 0.3 ? 1 : 0)) + (hasT(s,'polite') ? 0.5 : 0), c);
  const tip = tipFor(c, sat);
  addMoney(Math.round(money*0.9) + tip); G.today.tips += tip;

  if (err) toast(`⚠️ ${esc(s.name)} помилилась(вся) з клієнтом — оцінка низька`, 'bad');
  return Math.round(money);
}

// неактивні відділення працюють самі — на персоналі
function simOthers(){
  const rep = [];
  for (const b of G.others){
    let inc = 0, sal = 0, lv = 0, work = 0;
    for (const s of b.staff || []){
      if (s.role === 'rest' || (s.off || []).includes(wd())){ s.fat = 0; s.mood = Math.min(100, (s.mood ?? 80) + 20); continue; }
      work++; sal += s.salary; lv += s.lvl;
      const k = (s.role === 'store' ? 140 : s.role === 'courier' ? 200 : 280) * s.lvl / staffMul(s);
      inc += k;
      s.fat = Math.min(100, (s.fat||0) + 25); s.mood = clamp((s.mood ?? 80) - 5, 0, 100); s.fat = Math.max(0, s.fat - 20);
    }
    const front = (b.staff||[]).some(s => s.role === 'issue' || s.role === 'accept');
    inc = Math.round(inc * (b.rating/4) * (1 + (b.up.tier||0)*0.3) * (1 + (b.up.ads||0)*0.1) * (front ? 1 : 0.3) * ((DISTRICTS[b.district] || {inc:1}).inc));
    b.rating = clamp(b.rating + (work ? (3.4 + lv/work*0.3 - b.rating)*0.15 : -0.08), 1, 5);
    G.money += inc - sal; if (inc > 0) G.stats.earned += inc;
    G.stats.issued += Math.round(inc/40);
    rep.push({name:b.branch, inc:inc - sal, rating:b.rating, note: !work ? 'немає персоналу!' : !front ? 'немає нікого на видачі' : ''});
  }
  return rep;
}

/* ---------- інвентаризація ---------- */
function invRows(){

/* ---------- звірка каси в кінці дня ---------- */
let CASH_SUM = null;
function makeCashCheck(cashIn, short){
  const exp = CASH_FLOAT + cashIn, actual = Math.max(0, exp - short);
  // розкладаємо гроші в касі на купюри (не завжди «найкрупнішими»)
  const den = [1000,500,200,100,50,20,10,5,2,1], bills = {};
  let left = actual;
  for (const d of den){
    let k = Math.floor(left / d);
    if (d >= 100 && k > 0 && Math.random() < 0.45) k -= ri(1, Math.min(k, 2));
    if (k > 0){ bills[d] = k; left -= k*d; }
  }
  const opts = shuffle([...new Set([actual, actual + pick([10,20,50,100]), Math.max(0, actual - pick([10,20,50,100])), exp === actual ? actual + 200 : exp])]);
  return {exp, actual, short, bills, opts};
}

/* ---------- головний цикл ---------- */
function tick(){
  const now = performance.now();
  let dt = Math.min(0.5, (now - lastT)/1000); lastT = now;
  if (!G) return;
  if (G.phase === 'day' && !paused){
    const sp = G.settings.speed;
    dt *= sp;
    const prev = G.time;
    G.time += dt*MIN_PER_SEC;
    const dMin = G.time - prev;
    const ev = curEvent();
    if (ev && ev.extra && prev < 630 && G.time >= 630 && !G.trucksDone.x){ if (G.truck) truckLeave(); truckArrive('x'); }
    if (prev < 780 && G.time >= 780 && !G.trucksDone.d){ if (G.truck) truckLeave(); truckArrive('d'); }
    if (prev < 1080 && G.time >= 1080 && !G.trucksDone.e){ if (G.truck) truckLeave(); truckArrive('e'); }
    if (G.truck && G.time >= G.truck.leaveAt) truckLeave();
    for (const b of G.bizToday || []) if (!b.done && G.time >= b.at){ b.done = true; if (G.biz[b.id]) spawnBiz(b.id); }
    // поштомат: клієнти забирають посилки самі
    if (G.up.locker){
      const lp = G.parcels.filter(p => p.state === 'locker' && !p.res);
      let got = 0;
      for (const p of lp) if (Math.random() < 0.0045*dMin){ p.state = 'gone'; got++; }
      if (got){
        G.parcels = G.parcels.filter(p => p.state !== 'gone');
        addMoney(12*got); G.stats.issued += got; G.today.issued += got; G.stats.locker = (G.stats.locker||0) + got;
        if (Math.random() < 0.35) toast(`🟥 Хтось забрав посилку з поштомату (+${12*got} ₴)`);
      }
    }
    // нові клієнти
    if (G.time < 1170){
      const h = G.time/60;
      const tf = h < 10 ? 0.7 : h < 12 ? 1 : h < 14 ? 1.4 : h < 17 ? 1 : h < 19 ? 1.5 : 0.6;
      const lam = (0.03 + G.level*0.004) * (1 + G.up.ads*0.15) * (1 + G.up.tier*0.35) * tf * (0.5 + G.rating/7) * dayFlowMul();
      if (Math.random() < lam*dMin) spawnClient();
    }
    // терпіння
    for (const c of [...G.queue]){
      if (c.by && c.by !== 'me') continue;
      c.pat -= dt * (c.by === 'me' ? 0.3 : 1);
      if (c.pat <= 0) clientLeftAngry(c);
    }
    staffTick(dt * (manualMode() ? 0.6 : 1));
    if (G.sup.chg && G.time >= G.sup.chg){ G.sup.chg = 0; G.sup.bat = 100; G.sup.lowBat = 0; toast('🔋 Сканер заряджено!', 'good'); dirty = true; }
    inspTick(); outageTick();
    if (G.time >= 1200) endDay();
  }
  if (dirty && (!ptrDown || now - ptrDown > 1200)){ dirty = false; render(); } else liveUpdate();
  updScene(); ambientTick();
}

function updScene(){

  const W = SCENE.el.clientWidth || 600;
  SCENE.el.style.setProperty('--wallc', (WALLS[G.decor.wall] || WALLS.cream)[1]);

      d = document.createElement('div'); d.className = 'spr walk' + (c.reg ? ' reg' : '');
      d.dataset.act = 'serve'; d.dataset.id = c.id;

      d.style.left = (W - 30) + 'px'; d.style.top = '70px';
      SCENE.el.appendChild(d); SCENE.spr.set(c.id, d); d._kind = c.kind;
      if (SCENE.seen && TAB === 'hall') sDoor();
      requestAnimationFrame(() => requestAnimationFrame(() => { d.style.left = pos.x + 'px'; d.style.top = pos.y + 'px'; }));
      d._t = performance.now();
    } else if (d._x !== pos.x || d._y !== pos.y){
      d.style.left = pos.x + 'px'; d.style.top = pos.y + 'px'; d.classList.add('walk'); d._t = performance.now();

    const r = c.pat / c.max, mood = c.by ? '' : r < 0.25 ? '😤' : r < 0.5 ? '😐' : '';
    if (d._m !== mood){ d._m = mood; let m = d.querySelector('.mood'); if (!m){ m = document.createElement('span'); m.className = 'mood'; d.appendChild(m); } m.textContent = mood; }
    d.dataset.act = c.by ? '' : 'serve';
  });
  for (const [id, d] of SCENE.spr){
    if (ids.has(id)) continue;
    SCENE.spr.delete(id);
    const angry = SCENE.angry.delete(id);
    d.dataset.act = ''; d.classList.add('walk');
    d.innerHTML = `<span class="face">${angry ? '😠' : d.querySelector('.face').textContent}</span>${angry ? '' : `<span class="carry">${d._kind === 'get' ? '📦' : '🧾'}</span>`}`;
    requestAnimationFrame(() => { d.style.left = (W - 30) + 'px'; d.style.top = '70px'; });
    setTimeout(() => { d.style.opacity = '0'; }, 1300);
    setTimeout(() => d.remove(), 2000);
  }
  SCENE.seen = true;
}

    if (it.packed || it.s >= 4){ if (k !== 9){ mistake('Ця річ уже запакована власником — пакування не потрібне'); return renderFlow(); } }
    else if (k === 9){ mistake('Річ не запакована — треба обрати пакування'); return renderFlow(); }
    else if (k < it.s){ mistake('Не влазить! Треба більше пакування'); return renderFlow(); }
    if (it.f && !FLOW.wrap && !(it.packed)){ mistake('Крихке без пухирцевої плівки розіб’ється!'); return renderFlow(); }
    if (k !== 9 && k > it.s + 1){ FLOW.extra -= 0.5; toast('Завелика коробка, клієнт трохи незадоволений'); }
    const pk = PACK.find(p => p.k === k);
    it.packPrice = (pk ? pk.price : 0) + (FLOW.wrap ? 15 : 0);
    sScan(); advItem(c, 'pack');
    return renderFlow();
  }
  if (act === 'weigh'){ FLOW.weighed = true; beep(1200, 0.05); return renderFlow(); }
  if (act === 'weighok'){ advItem(c, 'weigh'); return renderFlow(); }
  if (act === 'city'){
    const it = c.items[FLOW.i];
    if (v !== it.city){ mistake(`Клієнт казав «${it.city}»!`); return renderFlow(); }
    sScan(); advItem(c, 'city');
    return renderFlow();
  }
  if (act === 'print'){ if (!printGuard(c.items.filter(it => !it.refused).length)) return; sPrinter(); return finishSend(c); }
}
function nextAfterPay(c){ FLOW.step = c.kind === 'shop' ? 'shopdone' : c.kind === 'get' ? (c.redir ? 'reprint' : 'give') : 'print'; FLOW.pay = {}; }
function afterPick(c){
  if (c.pids.every(id => FLOW.picked.includes(id))){ FLOW.openCell = null; FLOW.step = nextGetStep(c, 'cells'); }
}
function finishRefuse(c){
  const sat = rate(flowSat(c) + 0.5, c);
  FLOW = null; closeModal(); removeClient(c);
  addMoney(15); addXp(12); sCash();

}
function finishRedir(c){
  const ps = G.parcels.filter(p => c.pids.includes(p.id));
  ps.forEach(p => redirectParcel(p, c.redir));
  if (FLOW.newTtn && ps[0]) ps[0].ttn = FLOW.newTtn;
  const fee = c.redir.type === 'back' ? 0 : REDIR_FEE;
  const sat = rate(flowSat(c), c);
  FLOW = null; closeModal(); removeClient(c);
  addMoney(fee + 10); addXp(14); sCash(); countTask('redir', 1);

}
function flowSat(c){
  let sat = 5 - FLOW.mist + FLOW.extra;
  if (c.pat/c.max < 0.3) sat -= 1;
  return sat;
}
function finishGet(c){
  const ps = G.parcels.filter(p => c.pids.includes(p.id));
  giftResult(ps);
  const fee = FLOW.feeWaived ? 0 : feeOf(c);
  const money = ps.reduce((a,p) => a + 15 + Math.round(p.cod*0.02), 0) + fee;
  G.parcels = G.parcels.filter(p => !c.pids.includes(p.id));
  G.stats.issued += ps.length; G.today.issued += ps.length;
  const sat = rate(flowSat(c), c);
  const tip = tipFor(c, sat);
  const clean = FLOW.mist === 0;
  FLOW = null; closeModal(); removeClient(c);
  addMoney(money + tip); G.today.tips += tip; addXp(10*ps.length);
  G.today.streak = clean ? (G.today.streak||0) + ps.length : 0; countTask('streak', G.today.streak, true);
  if (c.reg) countTask('regs', 1); if (tip) countTask('tips', 1);
  sCash(); if (sat >= 4) regGift(c);

}
function finishShop(c){
  let money = 0;
  for (const [k,q] of Object.entries(FLOW.cart)){ const n = Math.min(q, G.shopStock[k]||0); G.shopStock[k] -= n; money += n*SHOP[k].p; }
  planAdd('shop', money);
  const sat = rate(flowSat(c), c);
  FLOW = null; closeModal(); removeClient(c);
  addMoney(money); addXp(6); sCash();
  toast(`${'⭐'.repeat(Math.round(sat))} 🛍️ Продано з вітрини · +${money} ₴`, 'good');
}
function finishInfo(c){

function finishLock(c){
  const ps = G.parcels.filter(p => c.pids.includes(p.id));
  G.parcels = G.parcels.filter(p => !c.pids.includes(p.id));
  G.stats.issued += ps.length; G.today.issued += ps.length;

function finishBiz(c){
  const b = BIZ[c.biz] || {rate:80};
  for (const it of c.items){ const p = makeParcel({item:{n:it.item, e:it.e, s:it.s, w:[it.w,it.w], f:it.f}, state:'outgoing'}); p.w = it.w; p.city = it.city; p.ttn = it.ttn; p.cod = 0; }
  const n = c.items.length, money = b.rate*n;
  G.stats.sent += n; G.today.sent += n; G.stats.bizSent = (G.stats.bizSent||0) + n;
  if (G.biz[c.biz]) G.biz[c.biz].strikes = Math.max(0, (G.biz[c.biz].strikes||0) - (FLOW.mist ? 0 : 1));
  const sat = rate(flowSat(c), c);
  FLOW = null; closeModal(); removeClient(c);
  addMoney(money); addXp(5*n); countTask('send', n); sCash();
  toast(`${'⭐'.repeat(Math.round(sat))} 🤝 Партію прийнято: ${n} відправлень · +${fmt(money)} ₴ за договором`, 'good');
}
function finishClaim(c, who){
  const ps = G.parcels.filter(p => c.pids.includes(p.id));
  G.parcels = G.parcels.filter(p => !c.pids.includes(p.id));
  G.stats.issued += ps.length; G.today.issued += ps.length;
  const sat = rate(flowSat(c) - (who === 'snd' ? 0.5 : 0), c);
  FLOW = null; closeModal(); removeClient(c);
  addMoney(15*ps.length); addXp(18); countTask('claim', 1); G.stats.claims = (G.stats.claims||0) + 1;
  toast(`${'⭐'.repeat(Math.round(sat))} 📝 Акт оформлено: ${who === 'car' ? 'клієнт отримає компенсацію від перевізника' : 'претензію треба подавати до відправника'}`, 'good');
}
function finishSend(c){
  const tot = sendTotal(c);
  const ok = c.items.filter(it => !it.refused);
  for (const it of ok){
    const p = makeParcel({item:{n:it.item, e:it.e, s:it.s, w:[it.w,it.w], f:it.f}, state:'outgoing'}); p.w = it.w; p.city = it.city; p.ttn = it.ttn || p.ttn; p.intl = it.intl || null; p.cod = 0;
  }
  const n = ok.length;
  const nI = ok.filter(it => it.intl).length, nC = ok.filter(it => it.cod).length;
  if (nI){ countTask('intl', nI); G.stats.intl = (G.stats.intl||0) + nI; }
  if (nC) countTask('cod', nC);
  planAdd('pack', ok.reduce((a,it) => a + (it.packPrice||0), 0)); planAdd('ins', ok.filter(it => it.val && !it.intl).length);
  G.stats.sent += n; G.today.sent += n;
  const sat = rate(flowSat(c), c);
  const tip = tipFor(c, sat);
  FLOW = null; closeModal(); removeClient(c);
  addMoney(tot.sum + tip); G.today.tips += tip; addXp(12*n);
  countTask('send', n); if (c.reg) countTask('regs', 1); if (tip) countTask('tips', 1);
  sCash(); if (sat >= 4) regGift(c);
  toast(`${'⭐'.repeat(Math.round(sat))} +${tot.sum} ₴${tip?` · чайові ${tip} ₴ 💝`:''}`, 'good');
}

      <button data-act="s3d">${G.settings.s3d !== false ? '🧊 3D зал: так' : '🧊 3D зал: ні (простий)'}</button></div></div>
    <div class="card"><h3>📲 Застосунок на телефон</h3>${installHTML()}</div>
    <div class="card"><h3>👤 Акаунт</h3>${accountHTML()}</div>
    <div class="card"><h3>☁️ Збереження</h3>
      ${G.pid ? `<div class="mute">Код збереження — щоб грати цим відділенням на іншому пристрої. Нікому його не показуй!</div><div class="code" style="margin:6px 0">${code}</div><button class="sm" data-act="copycode">📋 Скопіювати</button>`
        : `<div class="mute">Відділення ще не підключене до онлайну.</div><button class="sm" data-act="register">Підключити онлайн</button>`}
      <div style="margin-top:10px" class="mute">Відновити відділення з коду:</div>
      <div class="row"><input id="rcode" placeholder="NP-..."><button data-act="restore">Відновити</button></div>
      <div class="mute" style="margin-top:6px">Остання хмарна копія: ${NET.lastCloud ? new Date(NET.lastCloud).toLocaleTimeString('uk-UA') : '—'}</div></div>
    <div class="mute">Версія гри: ${GAME_BUILD}</div>`);
}

/* ---------- дії ---------- */
function act(a, el){
  const id = +el.dataset.id;
  if (['findrow','fetchcell','pay','change','give','packsel','wrap','pack','weigh','weighok','city','print','nina','appscan','proxyok','proxyno','closecell','pickscan','lostsearch','lostpick','open','inspok','inspno','refuse','redirpick','reprint','valpick','banok','banno','declpick','country','codpick','allref','codok','codless','clopen','clbox','clwho','clprint','lockpick','bulkscan','bulkweigh','bulkok','bulkprint','trpick','smspick','smspassok','smspassno','feeok','feewaive','fixjam','newroll','rushroll','bigpack','measure','dimpick','shopadd','shopclear','shopnext','shopgive','upsell'].includes(a)) return flowAct(a, el);
  switch(a){
    case 'scanhint': return toast('📟 Затисни штрихкод на посилці, щоб відсканувати');
    case 'supplies': return showSupplies();
    case 'buyroll': { const n = +el.dataset.v || 1; if (G.money < n*ROLL_COST) return toast('Не вистачає грошей', 'bad'); G.money -= n*ROLL_COST; G.sup.rolls += n; G.sup.warned = 0; sCash(); dirty = true; return showSupplies(); }
    case 'charge': { if (G.phase !== 'day') return; G.sup.chg = G.time + 25; toast('🔌 Сканер на зарядці 25 хв — поки що номери вводиш вручну'); dirty = true; return showSupplies(); }
    case 'restock': { const k = el.dataset.k, x = SHOP[k]; if (!x) return; if (G.money < x.c*10) return toast('Не вистачає грошей', 'bad'); G.money -= x.c*10; G.shopStock[k] = (G.shopStock[k]||0) + 10; sCash(); dirty = true; return showSupplies(); }
    case 'invopen': if (!G.inv || G.inv.state !== 'due') return; return showInv();
    case 'invans': { const r = invRows()[id]; if (r){ r.ans = el.dataset.v; showInv(); } return; }
    case 'invdone': return invDone();
    case 'lookedit': return showLook();
    case 'lookset': { G.look = lookOf(G.look); const k = el.dataset.k, v = el.dataset.v;
      if (k === 'hat'){ const h = LOOK_H[v]; if (!h || G.rank < h[1] || (h[2] && !winterShop() && G.look.hat !== v)) return; }
      if (k === 'e' && !LOOK_E.includes(v)) return; if (k === 'c' && !LOOK_C[v]) return;
      G.look[k] = v; save(); dirty = true; return showLook(); }
    case 'lookbadge': G.look = lookOf(G.look); G.look.badge = !!el.checked; save(); dirty = true; return;
    case 'lookok': closeModal(); cloudSave(true); toast('🧑‍💼 Вигляд оператора збережено', 'good'); dirty = true; return;
    case 'sched': { const s = G.staff.find(s => s.id === id); if (!s) return; const d = +el.dataset.v; s.off = s.off || [];
      if (s.off.includes(d)) s.off = s.off.filter(x => x !== d); else { if (s.off.length >= 3) return toast('Максимум 3 вихідні на тиждень', 'bad'); s.off.push(d); }
      if (G.phase === 'day' && d === wd()) toast(s.off.includes(d) ? `🏖️ ${esc(s.name)} пішов(ла) додому — сьогодні вихідний` : `👋 ${esc(s.name)} вийшов(ла) на роботу`);
      save(); dirty = true; return; }
    case 'lunch': { const s = G.staff.find(s => s.id === id); if (s){ s.lunch = +el.dataset.v; save(); dirty = true; } return; }
    case 'route': NET.route = null; return showRoute(id);
    case 'rtpick': { const R = NET.route; if (!R) return; if (R.order.includes(id)) R.order = R.order.filter(x => x !== id); else R.order.push(id); beep(700, 0.04, 'triangle'); return showRoute(R.sid); }
    case 'rtreset': { const R = NET.route; if (!R) return; R.order = []; return showRoute(R.sid); }
    case 'rtgo': { const s = G.staff.find(s => s.id === id), R = NET.route; if (!s || !R || s.route || G.phase !== 'day') return;
      const ps = R.order.map(i => G.parcels.find(p => p.id === i)).filter(p => p && p.state === 'cell'); if (!ps.length) return;
      const r = courierGo(s, ps, true); closeModal(); NET.route = null; sBell();
      toast(`🛵 ${esc(s.name)} поїхав(ла): ${r.km} км${r.km <= r.opt * 1.05 ? ' — ідеальний маршрут! 👌' : ` (найкоротший був ${r.opt} км)`} · повернеться ≈${hhmm(r.back)}`, 'good'); return; }
    case 'misout': { const p = G.parcels.find(p => p.id === G.hand); if (!p || !p.mis) return; misOut(p); sScan(); addXp(6); countTask('mis', 1); toast(`🔀 Пересорт відкладено — поїде у відділення №${p.mis.br} (${p.mis.city}) вечірньою машиною`, 'good'); return; }
    case 'serve': if (!FLOW) sayNext(); return openServe(id || (G.queue.find(c => !c.by)||{}).id);
    case 'reopen': if (FLOW){ FLOW.hidden = false; renderFlow(); } return;
    case 'mclose': if (modalIsFlow && FLOW){ FLOW.hidden = true; closeModal(); dirty = true; } else closeModal(); return;
    case 'startday': return startDay();
    case 'lockload': { let n = 0; while (lockerLoadOne()) n++; if (!n) return toast('Немає готових малих посилок для поштомату', 'bad'); G.time += n; beep(500, 0.08, 'triangle'); toast(`🟥 Завантажено в поштомат: ${n} пос. (−${n} хв)`, 'good'); dirty = true; return; }
    case 'bizsign': { const k = el.dataset.k, b = BIZ[k]; if (!b || G.biz[k] || G.level < b.lvl) return; if (Object.keys(G.biz).length >= bizMax()) return toast('Більше договорів не потягнете — розширте відділення', 'bad');
      G.biz[k] = {since:G.day, strikes:0}; sCash(); toast(`🤝 Договір з «${b.n}» підписано! Кур’єр приходитиме вдень.`, 'gold'); save(); dirty = true; return; }
    case 'bizend': { const k = el.dataset.k; if (!G.biz[k] || !confirm(`Розірвати договір з «${BIZ[k].n}»?`)) return; delete G.biz[k]; save(); dirty = true; return; }
    case 'cashpick': return cashResult(+el.dataset.v);
    case 'cashdone': closeModal(); if (NET.cashSum) showDaySummary(NET.cashSum); NET.cashSum = null; return;
    case 'clean': return cleanHall();
    case 'promote': {
      if (!rankReady()) return; G.rank++; sCash(); save(); cloudSave(true);
      showModal('🎖️ Підвищення!', `<div class="bigstart"><div class="e">${RANKS[G.rank].e}</div><h2>${RANKS[G.rank].n}</h2><p>Вітаємо з новою посадою! Щоденна надбавка: <b>${fmt(RANKS[G.rank].bonus)} ₴</b>.</p>${G.rank >= 2 ? '<p>🏤 Тепер можна відкрити ще одне відділення в іншому місті (вкладка «Кар’єра»).</p>' : ''}</div><button class="pri" style="width:100%" data-act="mclose">Дякую!</button>`);
      dirty = true; return;
    }
    case 'newbranch': NET.newDist = null; return showNewBranch();
    case 'pickdist': { const city = ($('#brcity') || {}).value, nm = ($('#brnew') || {}).value; NET.newDist = el.dataset.k; showNewBranch(); if (city) $('#brcity').value = city; if (nm) $('#brnew').value = nm; return; }
    case 'setdist': { if (G.district) return; const k = el.dataset.k; if (!DISTRICTS[k]) return; if (!confirm(`Головне відділення буде в районі «${DISTRICTS[k].n}». Змінити потім не можна. Підтвердити?`)) return; G.district = k; save(); toast(`${DISTRICTS[k].e} Відділення тепер у районі «${DISTRICTS[k].n}»`, 'good'); dirty = true; return; }
    case 'buybranch': return buyBranch();
    case 'switchbr': return switchBranch(id);
    case 'wall': {
      const k = el.dataset.k, w = WALLS[k]; if (!w) return;
      G.decor.walls = G.decor.walls || [];
      if (w[2] && !G.decor.walls.includes(k)){ if (G.money < w[2]) return toast('Не вистачає грошей', 'bad'); G.money -= w[2]; G.decor.walls.push(k); sCash(); }
      G.decor.wall = k; save(); dirty = true; return;
    }
    case 'decor': {
      const k = el.dataset.k, x = DECOR[k]; if (!x || G.decor.items[k]) return;
      if (G.money < x.c) return toast('Не вистачає грошей', 'bad');
      if (x.win && !winterShop()) return toast('Святковий декор продається тільки взимку', 'bad');
      G.money -= x.c; G.decor.items[k] = 1; sCash(); toast(`${x.e} ${x.n} тепер у залі!`, 'good'); save(); dirty = true; return;
    }
    case 'bonus': {
      const s = G.staff.find(s => s.id === id); if (!s || s.bonusDay === G.day) return;
      if (G.money < 200) return toast('Не вистачає грошей', 'bad');
      G.money -= 200; s.bonusDay = G.day; s.mood = Math.min(100, (s.mood ?? 80) + 25); sCash();
      toast(`💵 ${esc(s.name)} дуже вдячний(на) за премію!`, 'good'); dirty = true; return;
    }
    case 'pause': paused = !paused; dirty = true; return;
    case 'speed': G.settings.speed = G.settings.speed === 1 ? 2 : G.settings.speed === 2 ? 3 : 1; dirty = true; return;
    case 'savenow': save(); cloudSave(true).then(ok => toast(ok ? '💾 Збережено (і в хмару)' : '💾 Збережено на пристрої', 'good')); return;
    case 'guide': return showGuide();
    case 'settings': return showSettings();
    case 'take': {
      const p = G.parcels.find(p => p.id === id); if (!p) return;
      if (G.hand === id){ G.hand = null; dirty = true; return; }
      G.hand = id; p.target = targetCell(p);
      if (!p.target) toast('Немає вільних комірок такого розміру — купи стелажі або видавай посилки!', 'bad');
      dirty = true; return;
    }
    case 'cell': {
      const cid = el.dataset.id;
      const hand = G.parcels.find(p => p.id === G.hand);
      if (!hand){
        const ps = G.parcels.filter(p => p.state === 'cell' && p.cell === cid && !p.lost);
        toast(ps.length ? `${cid}: ` + ps.map(p => `${p.e} …${String(p.ttn).slice(-4)}`).join(' ') : `${cid}: порожньо`);
        return;
      }
      if (hand.target === cid){ sScan(); placeParcel(hand, cid); }
      else { sErr(); toast(`Не та комірка! Потрібна ${hand.target}`, 'bad'); }
      return;
    }
    case 'unload': {
      const p = G.parcels.find(p => p.id === id); if (!p || p.state !== 'truck') return;
      const need = G.up.cart ? 1 : p.s>=4?3:p.s===3?2:1;
      p.unl++; beep(400 + p.unl*120, 0.05, 'triangle');
      if (p.unl >= need){ p.state = 'pile'; G.stats.unloaded++; G.today.unloaded++; addXp(1); countTask('unload', 1); }
      dirty = true; return;
    }
    case 'unload3d': {
      if (!G.truck) return;
      if (G.truck.kind === 'in'){ const p = G.parcels.find(p => p.state === 'truck'); if (p) return act('unload', {dataset:{id:String(p.id)}}); return toast('Машина вже порожня ✅'); }
      const o = G.parcels.find(p => p.state === 'outgoing'); if (o) return act('load', {dataset:{id:String(o.id)}}); return toast('Все завантажено ✅');
    }
    case 'unloadall': {
      const ps = G.parcels.filter(p => p.state === 'truck');
      ps.forEach(p => { p.state = 'pile'; G.stats.unloaded++; G.today.unloaded++; }); countTask('unload', ps.length);
      G.time += ps.length; toast(`Розвантажено ${ps.length} посилок, пройшло ${ps.length} хв`); dirty = true; return;
    }
    case 'load': { const p = G.parcels.find(p => p.id === id); if (p && p.state === 'outgoing'){ p.state = 'loaded'; beep(500,0.05,'triangle'); addXp(1); } dirty = true; return; }
    case 'role': { const s = G.staff.find(s => s.id === id); if (s && s.route) return toast('Кур’єр зараз на маршруті', 'bad'); if (s && el.dataset.role === 'courier' && G.level < 4) return; if (s){ s.role = el.dataset.role; if (s.cl){ const c = G.queue.find(c => c.id === s.cl); if (c) c.by = null; s.cl = null; } } dirty = true; return; }
    case 'train': {
      const s = G.staff.find(s => s.id === id); if (!s) return;
      const cost = trainCost(s);
      if (G.money < cost) return toast('Не вистачає грошей', 'bad');
      G.money -= cost; s.training = G.day;
      if (s.cl){ const c = G.queue.find(c => c.id === s.cl); if (c) c.by = null; s.cl = null; }
      toast(`📚 ${esc(s.name)} пішов(ла) на навчання до кінця дня ${G.day}`); dirty = true; return;
    }
    case 'fire': {
      const s = G.staff.find(s => s.id === id); if (!s) return;
      if (!confirm(`Звільнити ${s.name}?`)) return;
      if (s.cl){ const c = G.queue.find(c => c.id === s.cl); if (c) c.by = null; }
      G.staff = G.staff.filter(x => x.id !== id); dirty = true; return;
    }
    case 'hire': {
      if (G.staff.length >= staffMax()) return;
      const s = G.cand.find(s => s.id === id); if (!s) return;
      G.cand = G.cand.filter(x => x.id !== id); G.staff.push(s);
      toast(`👋 ${esc(s.name)} тепер працює у вас!`, 'good'); dirty = true; return;
    }
    case 'buy': {
      const k = el.dataset.k, nx = upNext(k); if (!nx || upLock(k) || G.level < nx.need || G.money < nx.cost) return;
      G.money -= nx.cost; G.up[k]++; sCash();
      toast(`${UPS[k].e} ${UPS[k].n}: рівень ${G.up[k]}!`, 'good'); save(); dirty = true; return;
    }
    case 'rename': { const v = $('#brname').value.trim(); if (v){ G.branch = v.slice(0,40); save(); cloudSave(true); toast('Збережено', 'good'); dirty = true; } return; }
    case 'sound': G.settings.sound = !G.settings.sound; if (!G.settings.sound) ambientStop(); showSettings(); return;
    case 'ambient': G.settings.ambient = G.settings.ambient === false; if (G.settings.ambient) ambientStart(); showSettings(); return;
    case 'voice': G.settings.voice = G.settings.voice === false; if (G.settings.voice) sayNext(); showSettings(); return;
    case 's3d': G.settings.s3d = G.settings.s3d === false; sceneRebuild(); save(); showSettings(); return;
    case 'install': return doInstall();
    case 'copycode': { const t = $('.code').textContent; navigator.clipboard && navigator.clipboard.writeText(t).then(() => toast('Скопійовано', 'good'), () => {}); return; }
    case 'restore': return restoreFromCode($('#rcode').value.trim());
    case 'login': return showLogin();
    case 'dologin': return doLogin(el);
    case 'obback': return showOnboard();
    case 'acclink': return accLink(el);
    case 'accpass': return accPass(el);
    case 'acclogout': return accLogout();
    case 'devaccreset': { const pid = $('#devapl').value, pw = $('#devapw').value || ''; if (!pid) return toast('Обери гравця', 'bad'); if (pw.length < 6) return toast('Пароль — мінімум 6 символів', 'bad');
      devCall('np_admin_acc_reset', {p_player:pid, p_pass:pw}).then(r => { if (r) toast(`🔑 Пароль для ${r} змінено. Передай його гравцю.`, 'good'); }); return; }
    case 'register': return registerOnline();
    case 'onltab': NET.sub = el.dataset.v; if (NET.sub === 'week') loadWeek(); if (NET.sub === 'rev') loadMyReviews(); if (NET.sub === 'dev') devRefresh(); dirty = true; return;
    case 'revstar': NET.revStars = +el.dataset.v; if (NET.visit) NET.visit.draw(NET.visit.revs); return;
    case 'revsend': return sendReview(el.dataset.id);
    case 'giftmenu': NET.giftK = null; return showGiftMenu(el.dataset.id);
    case 'giftsel': NET.giftK = el.dataset.k; return showGiftMenu(NET.giftTo);
    case 'giftsend': return sendGift(el.dataset.id);
    case 'devrefresh': return devRefresh();
    case 'devann': { const t = ($('#devann').value || '').trim(); if (!t) return; devCall('np_admin_announce', {p_body:t}, '📢 Оголошення надіслано').then(devRefresh); return; }
    case 'devannoff': devCall('np_admin_ann_off', {p_ann:+el.dataset.id}, 'Прибрано').then(devRefresh); return;
    case 'devglobal': { const h = +$('#devh').value || 24, ev = $('#devev').value, w = $('#devw').value;
      Promise.all([devCall('np_admin_global', {p_k:'event', p_v:ev, p_hours: ev ? h : 0}), devCall('np_admin_global', {p_k:'weather', p_v:w, p_hours: w ? h : 0})]).then(() => { toast('🎉 Глобальні події оновлено', 'good'); devRefresh(); }); return; }
    case 'devflag': { const k = el.dataset.k; devCall('np_admin_global', {p_k:k, p_v:String(Date.now()), p_hours:24}, k === 'insp' ? '👔 Завтра у всіх буде перевірка' : '🔦 Завтра у всіх відключать світло'); return; }
    case 'devgift': { const to = $('#devto').value || null, t = $('#devgt').value, n = Math.max(1, Math.min(999999, Math.round(+$('#devgn').value || 0)));
      devCall('np_admin_gift', {p_to:to, p_item:`dev:${t}:${n}`, p_note:$('#devgnote').value || ''}).then(r => { if (r !== null) toast(`🎁 Надіслано ${r} гравц${r === 1 ? 'ю' : 'ям'}`, 'good'); }); return; }
    case 'devchatdel': devCall('np_admin_chat_del', {p_msg:+el.dataset.id}, 'Видалено').then(() => { const m = NET.chat.find(x => x.id === +el.dataset.id); if (m) m.del = 1; drawChat(); }); return;
    case 'coophost': return coopHost();
    case 'coopjoin': return coopJoin();
    case 'coopstop': return coopStop();
    case 'cooptake': { const C = NET.coop; if (!C || !C.host || C.job || C.waiting) return; C.waiting = true; coopSend({t:'take', id:G.pid, cid:id}); setTimeout(() => { if (NET.coop) NET.coop.waiting = false; }, 4000); return; }
    case 'coopreopen': return coopRender();
    case 'cpphone': case 'cpcell': case 'cppay': case 'cppack': case 'cpcity': case 'cpdone': return coopAct(a, el);
    case 'wcat': NET.wcat = el.dataset.v; NET.week = null; loadWeek(); dirty = true; return;
    case 'lbsort': NET.sort = el.dataset.v; NET.top = null; loadTop(); dirty = true; return;
    case 'chatsend': return chatSend();
    case 'player': return showPlayer(el.dataset.id);
    case 'onboard': return onboard(el);
    case 'regnick': { const n = ($('#regnick').value || '').trim().slice(0,24); if (n.length < 2) return toast('Мінімум 2 символи', 'bad'); closeModal(); return registerOnline(n); }
  }
}
document.addEventListener('click', e => {
  if (performance.now() - SCAN.last < 450) return; // клік після «піку» не рахуємо
  const t = e.target.closest('[data-tab]');
  if (t){ TAB = t.dataset.tab; if (TAB === 'online'){ NET.unread = 0; loadTop(); chatPoll(); } dirty = true; window.scrollTo(0,0); return; }
  const a = e.target.closest('[data-act]');
  if (a && a.dataset.act) act(a.dataset.act, a);
});
document.addEventListener('pointermove', e => { const d = $('#dark'); if (d && !d.classList.contains('hidden')){ d.style.setProperty('--fx', e.clientX + 'px'); d.style.setProperty('--fy', e.clientY + 'px'); } }, {passive:true});
document.addEventListener('change', e => { const a = e.target.closest('[data-act="wrap"]'); if (a) flowAct('wrap', a); const b = e.target.closest('[data-act="lookbadge"]'); if (b) act('lookbadge', b); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'chatin') chatSend(); });

/* ---------- збереження ---------- */
function save(){
  if (!G) return;
  G.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch(e){}
}
function loadLocal(){
  try { const s = localStorage.getItem(SAVE_KEY); return s ? migrate(JSON.parse(s)) : null; } catch(e){ return null; }
}

/* ---------- онлайн ---------- */
const NET = {ok: !!(CFG.supabaseUrl && CFG.supabaseKey), unread:0, sub:'top', sort:'level', top:null, chat:[], lastId:0, lastCloud:0, ch:null, saving:false, admin:false, week:null, myRev:null, adm:null, gev:null, gweather:null};
async function rpc(fn, args){
  if (!NET.ok) throw new Error('offline');
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, {method:'POST', headers:{'Content-Type':'application/json', apikey:CFG.supabaseKey}, body:JSON.stringify(args||{})});
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || t || ('HTTP ' + r.status));
  return j;
}

  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);

function weekParcels(){

function giftLabel(item){
  if (item.startsWith('dev:')){ const [, t, n] = item.split(':'); return t === 'money' ? `💰 ${fmt(+n)} ₴` : `⭐ ${fmt(+n)} XP`; }
  const g = GIFTS[item]; return g ? `${g.e} ${g.n}` : '🎁';

function applyGift(g){
  const it = g.item;
  if (it.startsWith('dev:')){ const [, t, n] = it.split(':'); if (t === 'money') addMoney(+n); else addXp(+n); }
  else if (it === 'coffee') G.staff.forEach(s => s.mood = Math.min(100, (s.mood ?? 80) + 20));
  else if (it === 'flowers') G.rating = clamp(G.rating + 0.05, 1, 5);
  else if (it === 'cake') Object.values(G.regs).forEach(r => { if (r.met) r.hearts = Math.min(5, r.hearts + 1); });
  else if (it === 'plant'){ if (G.decor.items.plant) addMoney(400); else G.decor.items.plant = 1; }
  else if (it === 'toy') addXp(150);
  else if (it === 'money') addMoney(800);
}

function coopAct(a, el){
  const C = NET.coop, j = C && C.job; if (!j) return;
  const v = el.dataset.v;
  if (a === 'cpphone'){ if (v !== j.phone) coopMist('Не той номер!'); else { sScan(); j.step = 'cell'; } }
  else if (a === 'cpcell'){
    const i = +el.dataset.i, p = j.parcels[i];
    if (v !== p.cell) coopMist(`Посилка в комірці ${p.cell}!`);
    else { sScan(); j.picked.push(i); j.cellOpts = null; if (j.picked.length >= j.parcels.length) j.step = j.parcels.some(p => p.cod) ? 'pay' : 'give'; }
  }
  else if (a === 'cppay'){ if ((v === 'card') !== j.card) coopMist(j.card ? 'Клієнт хотів карткою' : 'Клієнт дає готівку'); else { sCash(); j.step = j.kind === 'get' ? 'give' : 'print'; } }
  else if (a === 'cppack'){
    const it = j.items[j.i], k = +v;
    if (it.packed || it.s >= 4){ if (k !== 9){ coopMist('Річ уже запакована'); return coopRender(); } }
    else if (k === 9 || k < it.s){ coopMist(k === 9 ? 'Треба пакування' : 'Не влазить!'); return coopRender(); }
    sScan(); j.step = 'city';
  }
  else if (a === 'cpcity'){
    const it = j.items[j.i];
    if (v !== it.city){ coopMist(`Клієнт казав «${it.city}»`); return coopRender(); }
    sScan(); j.cityOpts = null;
    if (j.i < j.items.length - 1){ j.i++; j.step = 'pack'; } else j.step = 'pay';
  }
  else if (a === 'cpdone'){
    sPrinter(); coopSend({t:'done', id:G.pid, cid:j.cid, mist:j.mist, secs:Math.round((performance.now() - j.t0)/1000)});
    C.job = null; modalIsCoop = false; closeModal(); dirty = true; return;
  }

}

async function onboard(btn){

  const br = ($('#obbranch').value || '').trim().slice(0,40) || 'Відділення №1';

    busy(btn, true);

      const r = await rpc('np_acc_register', {p_nick:nick, p_branch:br, p_email:email, p_pass:pass});

      showGuide();

}

      <div class="mute" style="margin-top:8px">Назва відділення</div><input id="obbranch" maxlength="40" value="Відділення №1, вул. Центральна"></div>
    <div class="card"><div class="mute">👤 Акаунт (необов’язково) — щоб грати на телефоні й комп’ютері з одним прогресом</div>
      <input id="obemail" type="email" autocomplete="email" maxlength="120" placeholder="Пошта" style="margin-top:6px">
      <input id="obpass" type="password" autocomplete="new-password" maxlength="72" placeholder="Пароль (від 6 символів)" style="margin-top:6px"></div>
    <button class="pri" style="width:100%;padding:14px" data-act="onboard">🚀 Почати роботу</button>
    <button style="width:100%;margin-top:8px" data-act="login">🔑 Вже маю акаунт — увійти</button>
    <div class="mute" style="margin-top:10px">Грав без акаунта? Код збереження можна ввести в ⚙️ після старту.</div>`);
  $('#modal .x').classList.add('hidden');
}
function boot(){
  G = loadLocal();
  if (!G){ showOnboard(); G = null; }
  else { if (G.pid) NET.needSync = true; cloudSync(); connectChat(); if (G.cashChk) setTimeout(showCashCheck, 600); }
  setInterval(tick, 100);
  setInterval(() => { if (G){ save(); } }, 15000);
  setInterval(() => { if (G && G.pid){ cloudSave(); } }, 60000);
  setInterval(() => { if (G && G.pid && TAB === 'online'){ loadTop(); if (NET.sub === 'chat') chatPoll(); } }, 15000);
  setInterval(() => { if (G && G.pid && TAB !== 'online') chatPoll(); }, 45000);
  setInterval(checkVersion, 300000); checkVersion();
  setInterval(() => { if (G && !G.pid && !NET.regTried){ NET.regTried = true; registerOnline(); } }, 120000);
  setTimeout(chatPoll, 1500);
  setTimeout(() => { pollGlobal(); pollAnnounce(); pullGifts(); weekClaim(); }, 2500);
  setInterval(() => { if (G){ pollGlobal(); pollAnnounce(); } }, 180000);
  setInterval(() => { if (G && G.pid){ pullGifts(); } }, 300000);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden && G){ save(); cloudSave(true); } else syncOnReturn(); });
  window.addEventListener('focus', syncOnReturn);
}
boot();
</script>
